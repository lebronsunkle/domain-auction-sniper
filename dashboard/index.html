<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Auction Sniper</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, "Inter", "Segoe UI", sans-serif; }
    /* 2026-09-24 the client call: everything 25% bigger. zoom scales the whole
       UI uniformly (text, spacing, chips) without touching per-class sizes,
       so the layout survives. The client asked 50%, settled ~20-25%; tune here. */
    body { zoom: 1.25; }
    [data-monospace] { font-family: "SF Mono", "JetBrains Mono", Menlo, monospace; }
    /* Fade-out animation for ended rows */
    @keyframes fadeout {
      0%   { opacity: 1; transform: scale(1); max-height: 200px; }
      80%  { opacity: 0; transform: scale(0.95); }
      100% { opacity: 0; transform: scale(0.95); max-height: 0; padding: 0; margin: 0; border-width: 0; }
    }
    .ending-fade { animation: fadeout 5s ease forwards; pointer-events: none; }
    /* Pulse for very-urgent (<10s) */
    @keyframes urgentpulse {
      0%, 100% { opacity: 1; }
      50%      { opacity: 0.55; }
    }
    .urgent-pulse { animation: urgentpulse 1s ease-in-out infinite; }
  </style>
</head>
<body class="bg-slate-50 text-slate-900">
  <div id="root"></div>

  <script type="text/babel" data-type="module">
    const { useState, useEffect, useMemo, useRef, useCallback } = React;

    // -----------------------------------------------------------------------
    // Persistence
    // -----------------------------------------------------------------------

    const STORAGE_KEY = "sniper_dashboard_v2";

    // Backend API base. Production points at the Fly.io deployment; localhost
    // falls back for dev. Watchlist add/remove syncs against this so the client's
    // entries follow him across devices. If the backend is unreachable, the
    // dashboard keeps working with localStorage-only state.
    const BACKEND_URL = (() => {
      try {
        const h = window.location.hostname;
        if (h === "localhost" || h === "127.0.0.1") {
          return "http://localhost:8080";
        }
      } catch {}
      return "https://your-app.fly.dev";
    })();

    // The client's curation rules (2026-08-19 call): only these TLDs are worth
    // scanning, and nothing under $1,400 GoDaddy est. Applied to the feed
    // tabs (Closing Soon / Top Rated). Watchlist and explicit searches are
    // exempt — anything he starred or typed himself always shows.
    const TLD_ALLOW = new Set(["com", "ai", "co", "net", "org", "ca", "eu"]);
    const MIN_GD_EST = 1400;

    function loadPersistedState() {
      try { return JSON.parse(localStorage.getItem(STORAGE_KEY) || "{}"); }
      catch { return {}; }
    }
    function persistState(state) {
      try { localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); } catch {}
    }

    // ----- API auth ---------------------------------------------------------
    // The backend requires `Authorization: Bearer <token>` on every /api call.
    // The token is entered once per device and kept in localStorage — it is
    // deliberately NOT hardcoded here (this file is committed to the repo).

    const TOKEN_KEY = "sniper_api_token";
    function getApiToken() {
      try { return localStorage.getItem(TOKEN_KEY) || ""; } catch { return ""; }
    }
    function setApiToken(t) {
      try { localStorage.setItem(TOKEN_KEY, t); } catch {}
    }

    // Only prompt for the token once per page load, even if many parallel
    // requests all come back 401 (the watchlist refresh fans out).
    let tokenPromptShown = false;

    // ----- Engine pulse (2026-08-26, finacredit post-mortem) ----------------
    // The trigger worker reports its heartbeat through /health. A dead
    // worker used to be indistinguishable from a quiet one — finacredit was
    // lost to exactly that. This pill makes the engine state a glance.
    function EnginePulse() {
      const [pulse, setPulse] = useState(undefined);  // undefined=loading, null=unreachable
      useEffect(() => {
        let stop = false;
        const check = async () => {
          try {
            // no-store is load-bearing: Chrome cached a pre-pulse /health
            // (no worker field) and the pill screamed ENGINE DOWN at a
            // perfectly healthy engine (2026-08-26).
            const r = await fetch(`${BACKEND_URL}/health`, { cache: "no-store" });
            const b = await r.json();
            if (!stop) setPulse(b.worker || null);
          } catch { if (!stop) setPulse(null); }
        };
        check();
        const iv = setInterval(check, 30000);
        return () => { stop = true; clearInterval(iv); };
      }, []);
      if (pulse === undefined) return null;
      const tickMs = pulse && pulse.last_tick_at ? Date.parse(pulse.last_tick_at) : null;
      const ageSec = tickMs != null ? Math.max(0, Math.round((Date.now() - tickMs) / 1000)) : null;
      const dead = !pulse || ageSec == null || ageSec > 120;
      const dryRun = pulse && pulse.dry_run === true;
      const cls = dead
        ? "bg-rose-100 text-rose-700 border-rose-300"
        : dryRun
          ? "bg-amber-100 text-amber-700 border-amber-300"
          : "bg-emerald-50 text-emerald-700 border-emerald-200";
      const label = dead
        ? "ENGINE DOWN — auto-buys and snipes are NOT running"
        : dryRun
          ? "engine in DRY RUN — no real purchases"
          : `engine live · ${ageSec}s`;
      return (
        <span
          title={pulse && pulse.last_error ? `last error: ${pulse.last_error}` : (dead ? "The backend trigger worker has not ticked in over 2 minutes." : `ticks: ${pulse.ticks}, watching ${pulse.entries_last_tick} entries`)}
          className={`text-[10px] px-2 py-0.5 rounded-full border font-semibold ${cls}`}
        >
          {label}
        </span>
      );
    }

    // Live listingType -> our auction_type (2026-08-26 cookent.com: the
    // index said Buy Now, live said BID — the badge, and more importantly
    // the type stored on star, must obey the live answer).
    function liveTypeToAuctionType(lt) {
      if (!lt) return null;
      const u = String(lt).toUpperCase();
      if (u.includes("CLOSEOUT")) return "CLOSEOUT";
      if (u.includes("EXPIRY")) return "EXPIRY_AUCTION";
      return null;
    }

    // Effective type from a live state: PRICE EVIDENCE BEATS THE LABEL.
    // 2026-09-07 dellport: GoDaddy relists lapsed auctions with a $50
    // buy-now while still reporting listingType=EXPIRY_AUCTIONS. If you
    // can buy it now, it's a Buy Now — whatever their type field claims.
    function liveEffectiveType(lv) {
      if (!lv) return null;
      if (lv.buy_now != null) return "CLOSEOUT";
      return liveTypeToAuctionType(lv.listing_type);
    }

    // Per-transaction safety cap, mirrored from the backend so the
    // confirm-to-exceed dialog (2026-09-29) triggers at the real limit.
    // Defaults to the backend's own default; refreshed live by
    // refreshPerTxCap() on load so raising the cap server-side stays in sync.
    let PER_TX_CAP = 5000;
    async function refreshPerTxCap() {
      try {
        const r = await apiFetch("/api/settings");
        if (!r.ok) return;
        const s = await r.json().catch(() => null);
        const v = s && parseFloat(s.per_transaction_cap_dollars);
        if (v && !isNaN(v) && v > 0) PER_TX_CAP = v;
      } catch { /* keep the default */ }
    }

    async function apiFetch(path, opts = {}) {
      const doFetch = () => {
        const headers = { ...(opts.headers || {}) };
        const tok = getApiToken();
        if (tok) headers["Authorization"] = `Bearer ${tok}`;
        return fetch(`${BACKEND_URL}${path}`, { ...opts, headers });
      };
      let r = await doFetch();
      if (r.status === 401 && !tokenPromptShown) {
        tokenPromptShown = true;
        const entered = window.prompt(
          "This device isn't linked to the backend yet.\n" +
          "Paste the API token . It's stored on this device only:"
        );
        if (entered && entered.trim()) {
          setApiToken(entered.trim());
          r = await doFetch();
          if (r.status !== 401) tokenPromptShown = false; // token works; re-allow future prompts
        }
      }
      return r;
    }

    // ----- Backend watchlist client ----------------------------------------
    // Thin wrapper around the REST endpoints. Returns null on any error so
    // callers can degrade gracefully.

    async function apiListWatchlist() {
      try {
        const r = await apiFetch(`/api/watchlist`, { cache: "no-store" });
        if (!r.ok) return null;
        return await r.json();
      } catch { return null; }
    }

    async function apiAddWatchlist(listing) {
      try {
        // Strip TLD off the domain to match the schema's `tld` field, which
        // the backend uses to bootstrap an auction row if one doesn't exist.
        const dotIdx = (listing.domain || "").lastIndexOf(".");
        const tld = dotIdx >= 0 ? listing.domain.slice(dotIdx + 1) : "";
        const body = {
          listing_id: listing.listing_id,
          domain: listing.domain,
          tld,
          auction_type: listing.auction_type || "EXPIRY_AUCTION",
          current_price: listing.current_price ? String(priceNum(listing.current_price)) : null,
          estimated_value: listing.estimated_value ? String(priceNum(listing.estimated_value)) : null,
          end_time_utc: listing.end_time_utc || null,
          bid_count: listing.bid_count || 0,
          has_bids: !!listing.has_bids,
          score: listing.score ?? null,
        };
        const r = await apiFetch(`/api/watchlist`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(body),
        });
        if (r.status === 409) {
          // Already on the watchlist server-side; refetch to re-sync entry_id.
          const all = await apiListWatchlist();
          if (all) return all.find(e => e.listing_id === listing.listing_id) || null;
          return null;
        }
        if (!r.ok) return null;
        return await r.json();
      } catch { return null; }
    }

    async function apiDeleteWatchlist(entryId) {
      try {
        const r = await apiFetch(`/api/watchlist/${entryId}`, {
          method: "DELETE",
        });
        return r.ok;
      } catch { return false; }
    }

    async function apiLookupDomain(domain) {
      try {
        const r = await apiFetch(
          `/api/lookup?domain=${encodeURIComponent(domain)}`,
          { cache: "no-store" }
        );
        if (!r.ok) return null;
        return await r.json();
      } catch { return null; }
    }

    async function apiBuyCloseout(listing, maxTotal) {
      // listing: the auction-card object from the data feed
      // maxTotal: a number (dollars) the user is willing to spend
      try {
        const dotIdx = (listing.domain || "").lastIndexOf(".");
        const tld = dotIdx >= 0 ? listing.domain.slice(dotIdx + 1) : "";
        const body = {
          listing_id: listing.listing_id,
          domain: listing.domain,
          tld,
          current_price: listing.current_price ? String(priceNum(listing.current_price)) : null,
          estimated_value: listing.estimated_value ? String(priceNum(listing.estimated_value)) : null,
          max_total_dollars: String(maxTotal),
        };
        const r = await apiFetch(`/api/closeout/buy`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(body),
        });
        const data = await r.json().catch(() => ({}));
        return { ok: r.ok, status: r.status, body: data };
      } catch (err) {
        return { ok: false, status: 0, body: { detail: String(err) } };
      }
    }

    async function apiUpdateWatchlist(entryId, patch) {
      // patch = { max_bid_dollars?: number, is_armed?: bool, note?: string,
      //           notify_enabled?: bool, notify_email_to?: string }
      // Returns the updated entry, or { error: "<detail>" } so callers can
      // show the backend's reason (e.g. "can't snipe without a real
      // auction id") instead of a generic failure.
      try {
        const r = await apiFetch(`/api/watchlist/${entryId}`, {
          method: "PUT",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(patch),
        });
        if (!r.ok) {
          const body = await r.json().catch(() => ({}));
          return { error: body.detail || `Update failed (HTTP ${r.status})` };
        }
        return await r.json();
      } catch { return null; }
    }

    // -----------------------------------------------------------------------
    // Score / price / time helpers
    // -----------------------------------------------------------------------

    function scoreColor(score) {
      if (score >= 110) return "bg-emerald-100 text-emerald-900 border-emerald-300";
      if (score >= 90)  return "bg-sky-100 text-sky-900 border-sky-300";
      if (score >= 60)  return "bg-amber-100 text-amber-900 border-amber-300";
      return "bg-slate-100 text-slate-700 border-slate-300";
    }

    function priceNum(s) {
      if (s == null) return null;
      const n = parseFloat(String(s).replace(/[^\d.]/g, ""));
      return Number.isFinite(n) ? n : null;
    }

    function formatPrice(s) {
      const n = priceNum(s);
      if (n == null) return "—";
      // GoDaddy-style: $5, $1,580, $1.25 -- show cents only if non-zero
      if (n >= 100) return `$${Math.round(n).toLocaleString()}`;
      return n % 1 === 0 ? `$${n}` : `$${n.toFixed(2)}`;
    }

    function formatEndAbsolute(iso) {
      if (!iso) return "";
      return new Date(iso).toLocaleString(undefined, {
        weekday: "short", month: "short", day: "numeric",
        hour: "numeric", minute: "2-digit",
      });
    }

    // Format a remaining-time count to a compact label like "3m 22s" / "2h 14m" / "5d 3h"
    function formatRemaining(ms) {
      if (ms <= 0) return "ENDED";
      const totalSec = Math.floor(ms / 1000);
      const d = Math.floor(totalSec / 86400);
      const h = Math.floor((totalSec % 86400) / 3600);
      const m = Math.floor((totalSec % 3600) / 60);
      const s = totalSec % 60;
      if (d > 0) return `${d}d ${h}h left`;
      if (h > 0) return `${h}h ${m}m left`;
      if (m > 0) return `${m}m ${s}s left`;
      return `${s}s left`;
    }

    // Color class for urgency
    function urgencyClass(ms) {
      if (ms <= 0)            return "text-slate-400";
      if (ms < 10 * 1000)     return "text-red-600 urgent-pulse";
      if (ms < 10 * 60 * 1000)return "text-red-600";
      if (ms < 60 * 60 * 1000)return "text-orange-600";
      if (ms < 24 * 3600 * 1000) return "text-amber-700";
      return "text-slate-600";
    }

    // Next 3 PM Pacific (handles DST via Intl). Returns a UTC epoch ms.
    function nextThreePmPT() {
      const now = Date.now();
      // Iterate hour-by-hour from "now" looking for the next moment that's 15:00 in LA.
      // 48 hours is more than enough to find 3 PM PT regardless of caller's local TZ.
      const fmt = new Intl.DateTimeFormat("en-US", {
        timeZone: "America/Los_Angeles",
        hour: "numeric", hour12: false,
      });
      for (let i = 0; i < 48; i++) {
        const cand = now + i * 60 * 60 * 1000;
        const h = parseInt(fmt.format(new Date(cand)), 10);
        if (h === 15) {
          // Round down to the top of that hour in PT.
          const candDate = new Date(cand);
          const minutesInPt = parseInt(
            new Intl.DateTimeFormat("en-US", {
              timeZone: "America/Los_Angeles",
              minute: "numeric", hour12: false,
            }).format(candDate), 10
          );
          return cand - minutesInPt * 60 * 1000
                       - candDate.getSeconds() * 1000
                       - candDate.getMilliseconds();
        }
      }
      return now + 24 * 60 * 60 * 1000;
    }

    // -----------------------------------------------------------------------
    // Time-window filter chips. Each chip resolves to an "upper bound" epoch
    // for end_time. Items with end_time <= upper are kept (and end_time >= now,
    // we always exclude already-ended).
    // -----------------------------------------------------------------------

    const TIME_WINDOWS = [
      // The client's morning-routine killer feature -- "what closes before GoDaddy
      // stops accepting bids for the day" -- computed dynamically each render.
      { id: "today_3pm", label: "Today (3 PM PT)", isToday3pm: true },
      { id: "1h",  label: "< 1h",  hours: 1 },
      { id: "11h", label: "< 11h", hours: 11 },
      { id: "1d",  label: "< 1d",  hours: 24 },
      { id: "2d",  label: "< 2d",  hours: 48 },
      { id: "3d",  label: "< 3d",  hours: 72 },
      { id: "7d",  label: "< 7d",  hours: 24 * 7 },
      { id: "all", label: "All",   hours: Infinity },
    ];

    function windowUpperBoundMs(win, now) {
      if (!win || win.id === "all") return Infinity;
      if (win.isToday3pm) return nextThreePmPT();
      return now + win.hours * 60 * 60 * 1000;
    }

    // -----------------------------------------------------------------------
    // Tick provider -- broadcasts "now" to subscribed components so countdowns
    // update without each one running its own setInterval. We tick at 1 Hz;
    // child components decide whether to re-render based on how close to end.
    // -----------------------------------------------------------------------

    function useTick() {
      const [now, setNow] = useState(() => Date.now());
      useEffect(() => {
        const id = setInterval(() => setNow(Date.now()), 1000);
        return () => clearInterval(id);
      }, []);
      return now;
    }

    // -----------------------------------------------------------------------
    // Top-level app
    // -----------------------------------------------------------------------

    function App() {
      const persisted = useMemo(loadPersistedState, []);

      const [data, setData] = useState(null);
      const [loadError, setLoadError] = useState(null);
      const [tab, setTab] = useState(persisted.tab || "closing_soon");
      const [windowId, setWindowId] = useState(persisted.windowId || "1d");
      const [search, setSearch] = useState(persisted.search || "");
      const [theme, setTheme] = useState(persisted.theme || "all");
      const [pageSize, setPageSize] = useState(persisted.pageSize || 50);
      // Sort override. "default" = per-tab default; explicit keys take over.
      // Per the client 2026-06-03 the most-wanted ranking is by GD value, so the
      // "Top Rated" tab now defaults to gd_value (used to default to score).
      const [sortBy, setSortBy] = useState(persisted.sortBy || "default");
      // Bid vs Buy Now filter for the main tabs (The client 2026-08-18:
      // "everything is a bid — need to see Buy Nows easier").
      // 2026-09-07: deliberately NOT restored from localStorage. The client's
      // machine remembered "Buy Now only" from a past session and opened
      // to an empty list — he read it as the app being broken. Every page
      // load starts at Bid + Buy Now; narrowing is a per-visit choice.
      const [typeFilter, setTypeFilter] = useState("all");
      const [selected, setSelected] = useState(null);
      const [watchlist, setWatchlist] = useState(new Set(persisted.watchlist || []));
      // Map<listing_id, entry_id> — populated by the backend on sync. Needed
      // for DELETE calls (the API uses entry_id, not listing_id, in the path).
      // listing_ids without a matching entry_id are local-only (backend was
      // offline when added) and will sync up on the next successful add.
      const [entryIds, setEntryIds] = useState(new Map());
      const [endedListingIds, setEndedListingIds] = useState(new Set());
      // Live availability map (domain -> /api/search/live state). Declared
      // HERE, above visibleRows, because the row filter reads it — a
      // declaration lower down is a temporal-dead-zone crash (2026-08-25).
      const [liveValues, setLiveValues] = useState(new Map());

      const now = useTick();

      // Backend's full snapshot for each watchlist entry: id, domain,
      // max_bid, is_armed. Keyed by listing_id so we can quickly
      // read/update from a card.
      const [entryDetails, setEntryDetails] = useState(new Map());

      // Raw backend entry list from the mount fetch — input to the
      // domain-keyed reconciliation effect below.
      const [wlBackendEntries, setWlBackendEntries] = useState(null);
      const reconciledRef = useRef(false);

      // Live GoDaddy lookup data, refreshed on watchlist tab open. Keyed by
      // listing_id. Each value: {current_price, bid_count, end_time_utc,
      // refreshed_at}. The client 2026-06-03 wanted to see live bid state on
      // watchlisted items without leaving our app — the daily-sync data
      // can be 24h stale, this fills the gap.
      const [freshLookups, setFreshLookups] = useState(new Map());
      const [refreshingWatchlist, setRefreshingWatchlist] = useState(false);

      // Pull the canonical watchlist from the backend on mount. Merge with
      // local state so anything added while offline is preserved (it'll
      // sync up on the next toggle). This is a one-shot fetch — no polling.
      useEffect(() => {
        let cancelled = false;
        (async () => {
          refreshPerTxCap();  // sync the confirm-to-exceed threshold (2026-09-29)
          const entries = await apiListWatchlist();
          if (cancelled || !entries) return;
          setWlBackendEntries(entries);
          setWatchlist(prev => {
            const next = new Set(prev);
            for (const e of entries) next.add(e.listing_id);
            return next;
          });
          setEntryIds(prev => {
            const next = new Map(prev);
            for (const e of entries) next.set(e.listing_id, e.id);
            return next;
          });
          setEntryDetails(prev => {
            const next = new Map(prev);
            for (const e of entries) {
              next.set(e.listing_id, {
                id: e.id,
                domain: e.domain,
                max_bid_dollars: e.max_bid_dollars,
                is_armed: e.is_armed,
                status: e.status,
                notify_enabled: !!e.notify_enabled,
              });
            }
            return next;
          });
        })();
        return () => { cancelled = true; };
      }, []);

      // Refresh ALL watchlisted domains in parallel via /api/lookup. Per
      // The client 2026-06-03 — daily-sync data is too stale for items he's
      // actively bidding on. Skip items refreshed within the last 30s to
      // avoid hammering GoDaddy on a tab toggle. Caller can pass force=true
      // to override (e.g., explicit Refresh button).
      const refreshWatchlist = useCallback(async ({ force = false } = {}) => {
        if (!data) return;
        const wlListings = data.listings.filter(L => watchlist.has(L.listing_id));
        // Include backend-only entries (domain not in the current feed) so
        // their cards still show live GoDaddy state.
        const feedIds = new Set(wlListings.map(L => L.listing_id));
        for (const [lid, det] of entryDetails) {
          if (!feedIds.has(lid) && det.domain) {
            wlListings.push({ listing_id: lid, domain: det.domain });
          }
        }
        if (wlListings.length === 0) return;

        const cutoff = Date.now() - 30_000;
        const targets = force
          ? wlListings
          : wlListings.filter(L => {
              const prev = freshLookups.get(L.listing_id);
              return !prev || prev.refreshed_at < cutoff;
            });
        if (targets.length === 0) return;

        setRefreshingWatchlist(true);
        try {
          const results = await Promise.all(
            targets.map(async L => {
              const r = await apiLookupDomain(L.domain);
              return [L.listing_id, r];
            })
          );
          setFreshLookups(prev => {
            const next = new Map(prev);
            const now = Date.now();
            for (const [listingId, r] of results) {
              if (!r) continue;
              next.set(listingId, {
                found: r.found,
                current_price: r.current_price_dollars,
                estimated_value: r.estimated_value_dollars,
                end_time_utc: r.end_time_utc,
                bid_count: r.bid_count,
                refreshed_at: now,
              });
            }
            return next;
          });
        } finally {
          setRefreshingWatchlist(false);
        }
      }, [data, watchlist, freshLookups, entryDetails]);

      // ----- Watchlist reconciliation (domain-keyed) --------------------
      // 2026-07-11: the feed-parser fix rotated EVERY listing_id from a
      // synthetic hash to the real GoDaddy auction id, orphaning all
      // existing stars and backend entries (stored by the old ids). The
      // durable key is the DOMAIN. Once per page load, after both the
      // backend entries and the feed have arrived:
      //   1. Entry whose domain is in the feed under a NEW id -> migrate
      //      (re-add under the new id, carry max_bid/armed/note, delete old).
      //   2. Entry whose domain is NOT in the feed -> keep; it renders as
      //      a backend-only row and refreshes via /api/lookup.
      //   3. Local stars matching nothing (no feed row, no backend entry)
      //      -> pruned, so the counts stop lying.
      useEffect(() => {
        if (reconciledRef.current || !data || !wlBackendEntries) return;
        reconciledRef.current = true;
        (async () => {
          const feedByDomain = new Map(data.listings.map(L => [L.domain, L]));
          const feedIds = new Set(data.listings.map(L => L.listing_id));
          const migrations = [];   // [{oldId, oldEntryId, newId, newEntry}]
          const backendIds = new Set();

          for (const e of wlBackendEntries) {
            const L = feedByDomain.get(e.domain);
            if (L && L.listing_id !== e.listing_id) {
              // Same domain, rotated id — migrate the entry.
              const newEntry = await apiAddWatchlist(L);
              if (!newEntry || newEntry.id == null) {
                backendIds.add(e.listing_id);  // migration failed; keep old
                continue;
              }
              // Carry over the client's settings. Only send fields that hold
              // meaningful values; PUT treats absent fields as "no change".
              const patch = {};
              if (e.max_bid_dollars != null) patch.max_bid_dollars = e.max_bid_dollars;
              if (e.is_armed === false) patch.is_armed = false;
              if (e.note) patch.note = e.note;
              if (Object.keys(patch).length > 0) {
                await apiUpdateWatchlist(newEntry.id, patch);
              }
              await apiDeleteWatchlist(e.id);
              migrations.push({ oldId: e.listing_id, newId: L.listing_id, newEntry });
              backendIds.add(L.listing_id);
            } else {
              backendIds.add(e.listing_id);
            }
          }

          setWatchlist(prev => {
            const next = new Set();
            for (const id of prev) {
              // Keep ids that still mean something; drop orphaned hashes.
              if (feedIds.has(id) || backendIds.has(id)) next.add(id);
            }
            for (const m of migrations) next.add(m.newId);
            return next;
          });
          if (migrations.length > 0) {
            setEntryIds(prev => {
              const next = new Map(prev);
              for (const m of migrations) {
                next.delete(m.oldId);
                next.set(m.newId, m.newEntry.id);
              }
              return next;
            });
            setEntryDetails(prev => {
              const next = new Map(prev);
              for (const m of migrations) {
                const old = next.get(m.oldId);
                next.delete(m.oldId);
                next.set(m.newId, {
                  id: m.newEntry.id,
                  domain: m.newEntry.domain,
                  max_bid_dollars: old?.max_bid_dollars ?? m.newEntry.max_bid_dollars,
                  is_armed: old?.is_armed ?? m.newEntry.is_armed,
                  status: m.newEntry.status,
                  notify_enabled: old?.notify_enabled ?? !!m.newEntry.notify_enabled,
                });
              }
              return next;
            });
          }
        })();
      }, [data, wlBackendEntries]);

      // Auto-refresh on watchlist tab open. Fires once on first switch
      // to the tab; subsequent toggles within 30s reuse cached lookups.
      //
      // CRITICAL: include `data` in deps so the effect re-fires AFTER the
      // initial data load completes. On a hard browser refresh, the tab
      // state ("watchlist") is restored from localStorage BEFORE data is
      // fetched, so the first run hits the `if (!data) return` guard
      // inside refreshWatchlist. Once data arrives, the dep change
      // triggers a second run that actually fetches.
      useEffect(() => {
        if (tab === "watchlist" && data) {
          refreshWatchlist();
        }
      }, [tab, watchlist.size, data]);  // re-run when items added/removed OR data loads

      // Lookup-and-add: prompt for a domain name, query GoDaddy via our
      // /api/lookup endpoint, and add it to the watchlist if it's currently
      // in an auction. This is the "the client pastes any domain" workflow.
      const addByLookup = useCallback(async () => {
        const raw = window.prompt(
          "Enter a domain to look up (e.g., crystalpro.com or buyflexeon.com):",
          ""
        );
        if (!raw) return;
        const domain = raw.trim().toLowerCase();
        if (!domain.includes(".")) {
          alert(`"${raw}" doesn't look like a domain.`);
          return;
        }

        const result = await apiLookupDomain(domain);
        if (!result) {
          alert(`Lookup failed for ${domain}. Backend or network issue.`);
          return;
        }
        if (!result.found) {
          alert(
            `Couldn't find ${domain} in GoDaddy auctions.\n\n` +
            (result.failure_message || "It may not currently be in an auction.")
          );
          return;
        }

        // Build a listing-shaped object so we can reuse apiAddWatchlist.
        const listingShim = {
          listing_id: result.listing_id || Date.now(),
          domain: result.domain || domain,
          auction_type: result.auction_type || "EXPIRY_AUCTION",
          current_price: result.current_price_dollars,
          estimated_value: result.estimated_value_dollars,
          end_time_utc: result.end_time_utc,
          bid_count: result.bid_count || 0,
          has_bids: (result.bid_count || 0) > 0,
          score: null,
        };

        const entry = await apiAddWatchlist(listingShim);
        if (!entry) {
          alert(
            `Found ${domain} (${result.auction_type}) but failed to add to watchlist. ` +
            `It may already be on the list.`
          );
          return;
        }
        // Add to local state so it shows up immediately in the Watchlist tab.
        setWatchlist(prev => {
          const next = new Set(prev);
          next.add(entry.listing_id);
          return next;
        });
        setEntryIds(prev => {
          const next = new Map(prev);
          next.set(entry.listing_id, entry.id);
          return next;
        });
        setEntryDetails(prev => {
          const next = new Map(prev);
          next.set(entry.listing_id, {
            id: entry.id,
            max_bid_dollars: entry.max_bid_dollars,
            is_armed: entry.is_armed,
            status: entry.status,
            notify_enabled: !!entry.notify_enabled,
          });
          return next;
        });
        alert(
          `Added ${entry.domain} to watchlist!\n\n` +
          `Type: ${result.auction_type}\n` +
          `Current: ${formatPrice(result.current_price_dollars)}\n` +
          `GD est: ${formatPrice(result.estimated_value_dollars)}\n\n` +
          `Switch to the Watchlist tab to set a max bid.`
        );
      }, []);

      // Listings with a Buy Now purchase currently in flight. Blocks the
      // double-tap double-buy (audit R3): the button disables while a
      // purchase runs, and a second tap on a slow response does nothing.
      // The backend has its own duplicate guard as the real enforcement;
      // this is the UX layer.
      const [buyingIds, setBuyingIds] = useState(new Set());

      // Click handler for instant-buying a closeout. Confirms with the user
      // first showing the current price and a max-total ceiling. The backend
      // call also re-checks the price against the ceiling so any tick-down
      // between this click and the SOAP estimate is handled safely.
      const buyNow = useCallback(async (listing) => {
        const isClose = listing.auction_type === "CLOSEOUT";
        if (!isClose) {
          alert("Buy Now is only available for closeout listings.");
          return;
        }
        if (buyingIds.has(listing.listing_id)) {
          return;  // purchase already in flight for this listing
        }
        const currentPrice = priceNum(listing.current_price);
        // We pad the ceiling by 50% over the listing price to leave room for
        // renewal + ICANN + tax (typical total ~ 3x listing price). Worst case
        // backend rejects with 409 if price moved out of band.
        const defaultMax = currentPrice ? Math.max(20, Math.ceil(currentPrice * 3.5)) : 50;
        const maxStr = window.prompt(
          `Buy ${listing.domain} now?\n\n` +
          `Current Buy Now price: ${formatPrice(listing.current_price)}\n` +
          `Estimated total (with renewal+ICANN+tax): ~${formatPrice(currentPrice * 3.5)}\n\n` +
          `Your max total ceiling in dollars (will not exceed):`,
          String(defaultMax)
        );
        if (maxStr === null) return;
        const maxTotal = Number(maxStr);
        if (!(maxTotal > 0)) {
          alert("Bad max total — must be a positive number.");
          return;
        }
        setBuyingIds(prev => new Set(prev).add(listing.listing_id));
        try {
          const result = await apiBuyCloseout(listing, maxTotal);
          if (!result.ok) {
            alert(`Buy failed (${result.status}): ${result.body.detail || JSON.stringify(result.body)}`);
            return;
          }
          const b = result.body;
          const prefix = b.dry_run ? "[DRY RUN] " : "";
          alert(
            `${prefix}${b.success ? "Purchase succeeded" : "Purchase failed"}\n\n` +
            `Domain: ${b.domain}\n` +
            `Listing price: ${formatPrice(b.current_price_dollars)}\n` +
            `Total cost: ${formatPrice(b.total_cost_dollars)}\n` +
            (b.order_id ? `Order ID: ${b.order_id}\n` : "") +
            `\n${b.message}`
          );
        } finally {
          setBuyingIds(prev => {
            const next = new Set(prev);
            next.delete(listing.listing_id);
            return next;
          });
        }
      }, [buyingIds]);

      // Click handler for editing max_bid on a watchlist entry. Uses a
      // window.prompt for simplicity — no modal component yet. Returns
      // the new value or null if user cancelled. Pushes to backend and
      // updates local state on success.
      const editMaxBid = useCallback(async (listingId, auctionType) => {
        const det = entryDetails.get(listingId);
        if (!det) {
          alert("This domain isn't in your synced watchlist yet. Try refreshing the page.");
          return;
        }
        const current = det.max_bid_dollars ?? "";
        // Same field under the hood; very different meaning to the client:
        // closeouts are fixed-price, so this is an AUTO-BUY trigger, not
        // a bid (2026-08-18 call).
        const isCloseoutEntry = auctionType === "CLOSEOUT";
        const next = window.prompt(
          isCloseoutEntry
            ? "Auto-buy price in dollars. The system watches this closeout " +
              "and BUYS it the moment the price drops to this or lower " +
              "(fees included in safety caps). Leave empty to clear."
            : "Max bid in dollars (e.g. 25 or 25.00). Leave empty to clear.",
          current
        );
        if (next === null) return;  // cancelled

        const trimmed = next.trim();
        // Confirm-to-exceed (2026-09-29, the client): rather than silently
        // rejecting a bid over the safety cap (and leaving him confused when
        // it "doesn't work"), ask once and let him deliberately surpass it.
        // The backend still re-checks; this just turns a silent block into a
        // conscious choice. Clearing/lowering under the cap clears any prior
        // override (explicit null).
        let capOverride = null;
        if (trimmed !== "") {
          const amt = parseFloat(trimmed);
          if (!isNaN(amt) && amt > PER_TX_CAP) {
            const ok = window.confirm(
              `$${amt.toLocaleString()} is over your $${PER_TX_CAP.toLocaleString()} ` +
              `safety limit.\n\nThis limit protects against typos (like an extra zero). ` +
              `Do you want to allow the sniper to spend up to $${amt.toLocaleString()} ` +
              `on ${det.domain || "this domain"}?`
            );
            if (!ok) return;  // he declined — leave the bid unchanged
            capOverride = trimmed;
          }
        }
        const patch = trimmed === ""
          ? { max_bid_dollars: null, cap_override_dollars: null }
          : { max_bid_dollars: trimmed, cap_override_dollars: capOverride };
        // Auto re-arm (2026-09-07 dellport lifecycle): setting a price on
        // an entry stranded in a terminal state (executed after a 504,
        // outbid, expired...) means "get back in there" — one action, no
        // unstar/restar dance. The worker resumes watching immediately.
        if (trimmed !== "" && det.status && det.status !== "pending") {
          patch.reopen = true;
          patch.is_armed = true;
        }

        if (det.id == null) {
          // Entry still syncing (optimistic-star window). Queue the bid —
          // it applies automatically the moment the backend entry lands —
          // and reflect it in the UI right away.
          pendingBidRef.current.set(listingId, patch);
          setEntryDetails(prev => {
            const next = new Map(prev);
            const d = next.get(listingId) || {};
            next.set(listingId, { ...d, max_bid_dollars: trimmed === "" ? null : trimmed });
            return next;
          });
          return;
        }
        const updated = await apiUpdateWatchlist(det.id, patch);
        if (!updated) {
          alert("Failed to update max bid. Check your connection and try again.");
          return;
        }
        if (updated.error) {
          alert(updated.error);
          return;
        }
        setEntryDetails(prev => {
          const next = new Map(prev);
          const old = prev.get(listingId);
          next.set(listingId, {
            id: updated.id,
            domain: updated.domain || old?.domain,
            max_bid_dollars: updated.max_bid_dollars,
            is_armed: updated.is_armed,
            status: updated.status,
            notify_enabled: !!updated.notify_enabled,
          });
          return next;
        });
      }, [entryDetails]);

      // Bell toggle: email reminders at 24h / 12h / 3h / 30m before close.
      // Server-side by design — the emails have to go out while the laptop
      // is closed, so the ONLY state that matters is notification_prefs in
      // Postgres. We update locally first for instant feedback and roll
      // back if the backend refuses.
      const toggleNotify = useCallback(async (listingId) => {
        const det = entryDetails.get(listingId);
        if (!det) return;
        if (det.id == null) {
          // Still inside the optimistic-star window — there's no entry id to
          // attach prefs to yet. Star sync takes ~1s.
          alert("Still saving this domain — try the bell again in a second.");
          return;
        }
        const nextEnabled = !det.notify_enabled;
        setEntryDetails(prev => {
          const next = new Map(prev);
          const d = next.get(listingId);
          if (d) next.set(listingId, { ...d, notify_enabled: nextEnabled });
          return next;
        });

        const updated = await apiUpdateWatchlist(det.id, { notify_enabled: nextEnabled });
        if (!updated || updated.error) {
          // Roll back — a bell showing "on" that isn't on server-side is
          // worse than no bell at all.
          setEntryDetails(prev => {
            const next = new Map(prev);
            const d = next.get(listingId);
            if (d) next.set(listingId, { ...d, notify_enabled: !nextEnabled });
            return next;
          });
          alert((updated && updated.error) || "Couldn't update reminders. Check your connection.");
          return;
        }
        setEntryDetails(prev => {
          const next = new Map(prev);
          const d = next.get(listingId);
          next.set(listingId, {
            ...(d || {}),
            id: updated.id,
            max_bid_dollars: updated.max_bid_dollars,
            is_armed: updated.is_armed,
            status: updated.status,
            notify_enabled: !!updated.notify_enabled,
          });
          return next;
        });
      }, [entryDetails]);

      useEffect(() => {
        persistState({
          tab, windowId, search, theme, pageSize, sortBy,
          watchlist: Array.from(watchlist),
        });
      }, [tab, windowId, search, theme, pageSize, sortBy, watchlist]);

      const loadFromFile = useCallback(async (file) => {
        setLoadError(null);
        try {
          const text = await file.text();
          const parsed = JSON.parse(text);
          if (!parsed.listings || !Array.isArray(parsed.listings)) {
            throw new Error("Not a scored sync JSON (no listings array)");
          }
          setData(parsed);
        } catch (e) {
          setLoadError(e.message || String(e));
        }
      }, []);

      const loadFromUrl = useCallback(async (url) => {
        setLoadError(null);
        try {
          const r = await fetch(url, { cache: "no-store" });
          if (!r.ok) throw new Error(`HTTP ${r.status}`);
          const parsed = await r.json();
          if (!parsed.listings || !Array.isArray(parsed.listings)) {
            throw new Error("Not a scored sync JSON (no listings array)");
          }
          setData(parsed);
        } catch (e) {
          setLoadError(e.message || String(e));
        }
      }, []);

      // Auto-load on startup. data/ is canonical; out/ is the dev fallback.
      useEffect(() => {
        if (data) return;
        const candidates = [
          "../data/scored_both.json",
          "../data/scored_expiring.json",
          "../data/scored_closeouts.json",
          "/data/scored_expiring.json",
          "/data/scored_closeouts.json",
          "../out/scored_expiring.json",
          "../out/scored_closeouts.json",
          "./scored_expiring.json",
        ];
        (async () => {
          for (const url of candidates) {
            try {
              const r = await fetch(url, { cache: "no-store" });
              if (r.ok) {
                const parsed = await r.json();
                if (parsed.listings && Array.isArray(parsed.listings)) {
                  setData(parsed);
                  return;
                }
              }
            } catch {}
          }
        })();
        // eslint-disable-next-line react-hooks/exhaustive-deps
      }, []);

      const allThemes = useMemo(() => {
        if (!data) return [];
        const seen = new Set();
        for (const L of data.listings) for (const t of (L.themes || [])) seen.add(t);
        return Array.from(seen).sort();
      }, [data]);

      const win = useMemo(
        () => TIME_WINDOWS.find(w => w.id === windowId) || TIME_WINDOWS[3],
        [windowId]
      );

      // Build the filtered + sorted list per active tab. We re-run this on
      // every tick so newly-ended rows drop out, but the work is cheap (the
      // filter is O(n) and n is 5000 max).
      const visibleRows = useMemo(() => {
        if (!data) return [];
        const q = (search || "").trim().toLowerCase();
        const themeFilter = theme !== "all";
        const windowUpper = windowUpperBoundMs(win, now);

        const filtered = [];
        for (const L of data.listings) {
          if (q && !L.domain.toLowerCase().includes(q)) continue;
          if (themeFilter && !(L.themes || []).includes(theme)) continue;
          if (typeFilter !== "all" && tab !== "watchlist" && L.auction_type !== typeFilter) continue;
          if (tab !== "watchlist") {
            // The client's curation rules — junk TLDs and sub-$1,400 est are
            // noise. 2026-09-19 call: nulls used to count as below the
            // floor and vanish silently (part of the dentl-class misses).
            // The floor now applies only when an estimate EXISTS — unknown
            // value is shown, not hidden.
            const tld = L.domain.slice(L.domain.lastIndexOf(".") + 1);
            if (!TLD_ALLOW.has(tld)) continue;
            const est = priceNum(L.estimated_value);
            if (est != null && est < MIN_GD_EST) continue;
          }

          if (tab === "watchlist") {
            if (!watchlist.has(L.listing_id)) continue;
            // KEEP ended items in the watchlist (they get sorted into a
            // separate "Expired" sub-section below). Per a 5/29 review: the client
            // wants to review what he was watching even after it timed out.
          } else {
            // Both Closing Soon AND Top Rated honor the time window so
            // The client can ask "best-scored domains closing in the next 48h"
            // (his actual mental model per the 5/28 call). Also auto-remove
            // already-ended items from both views.
            // 2026-08-25 (buildultra): live availability outranks the feed.
            // A closeout that "ended" per yesterday's feed but reappears at
            // the next rung ($11 -> $5) MUST stay on the board. Live data
            // also carries the new rung's end time for the countdown.
            const lv = liveValues.get(L.domain);
            const liveAvail = lv ? lv.status === "AVAILABLE" : null;
            // Feed end-time parse is cached on the row (2026-09-21): this
            // loop runs every second, and at 30k listings (The client's new
            // ship size) 30k Date parses per tick is real jank on his
            // machine. Parse once, remember forever — live end times still
            // win when present.
            if (L._endMs === undefined) {
              L._endMs = L.end_time_utc ? new Date(L.end_time_utc).getTime() : null;
            }
            const endMs = (liveAvail && lv.end_time_utc)
              ? new Date(lv.end_time_utc).getTime()
              : L._endMs;
            if (liveAvail === false && !endedListingIds.has(L.listing_id)) continue;
            if (endMs == null) continue;
            if (!liveAvail && endMs <= now && !endedListingIds.has(L.listing_id)) continue;
            if (endMs > windowUpper) continue;
          }
          filtered.push(L);
        }

        // Watchlist tab: also show backend entries whose domain fell out
        // of the current feed (auction ended, dropped below the top-5000
        // cutoff, or added via "+ Add domain"). They'd otherwise vanish
        // while still counting toward the badge. Live data for these
        // comes from the /api/lookup refresh (freshLookups).
        if (tab === "watchlist") {
          const feedIds = new Set(data.listings.map(L => L.listing_id));
          for (const [lid, det] of entryDetails) {
            if (feedIds.has(lid)) continue;
            if (!det.domain) continue;
            if (q && !det.domain.toLowerCase().includes(q)) continue;
            if (themeFilter) continue;  // no theme data for backend-only rows
            filtered.push({
              listing_id: lid,
              domain: det.domain,
              auction_type: null,
              current_price: null,
              estimated_value: null,
              end_time_utc: null,
              bid_count: null,
              has_bids: false,
              score: null,
              themes: [],
              _backend_only: true,
            });
          }
        }

        // Per-tab default sort key. The client 2026-06-03 — Top Rated now
        // defaults to GD value (was score).
        const defaultKey = (
          tab === "closing_soon" ? "end_time" :
          tab === "watchlist"    ? "score"    :
                                   "gd_value"
        );
        const effectiveSort = (sortBy === "default" || !sortBy) ? defaultKey : sortBy;

        const comparators = {
          end_time: (a, b) => {
            const aMs = a.end_time_utc ? new Date(a.end_time_utc).getTime() : Infinity;
            const bMs = b.end_time_utc ? new Date(b.end_time_utc).getTime() : Infinity;
            return aMs - bMs;
          },
          score:    (a, b) => (b.score ?? 0) - (a.score ?? 0),
          gd_value: (a, b) => (priceNum(b.estimated_value) ?? 0) - (priceNum(a.estimated_value) ?? 0),
          current_price: (a, b) => (priceNum(a.current_price) ?? Infinity) - (priceNum(b.current_price) ?? Infinity),
          bid_count: (a, b) => (b.bid_count ?? 0) - (a.bid_count ?? 0),
        };
        filtered.sort(comparators[effectiveSort] || comparators[defaultKey]);

        return filtered;
      }, [data, tab, win, now, search, theme, sortBy, typeFilter, watchlist, endedListingIds, entryDetails, liveValues]);

      // When a listing's end_time passes "now" while user is viewing, mark
      // it for fade-out, then remove after 5s. Now runs for all tabs since
      // they all show countdowns post-5/28.
      useEffect(() => {
        if (!data) return;
        const newlyEnded = [];
        for (const L of visibleRows.slice(0, pageSize)) {
          // A card may only fade when the live check CONFIRMS the domain
          // is gone. Stale feed clocks lie (buildultra), and "no live data
          // yet" is unknown, not dead — dellport faded on page load in the
          // race before its first live answer arrived (2026-09-07).
          const lv = liveValues.get(L.domain);
          if (!lv || lv.status === "AVAILABLE") continue;
          const endMs = L.end_time_utc ? new Date(L.end_time_utc).getTime() : null;
          if (endMs != null && endMs <= now && !endedListingIds.has(L.listing_id)) {
            newlyEnded.push(L.listing_id);
          }
        }
        if (newlyEnded.length === 0) return;
        setEndedListingIds(prev => {
          const next = new Set(prev);
          newlyEnded.forEach(id => next.add(id));
          return next;
        });
        // Drop them from the ended set 5s later so they truly disappear.
        const t = setTimeout(() => {
          setEndedListingIds(prev => {
            const next = new Set(prev);
            newlyEnded.forEach(id => next.delete(id));
            return next;
          });
        }, 5200);
        return () => clearTimeout(t);
      }, [tab, visibleRows, now, pageSize, data, endedListingIds]);

      const visible = visibleRows.slice(0, pageSize);

      // toggleWatch accepts EITHER a listing object OR just a listing_id.
      // Passing the listing lets us POST the auction snapshot to the backend
      // so it can bootstrap an auctions row if needed. When only the id is
      // available (e.g., removing from the watchlist tab), we do a local-only
      // optimistic update and use the cached entry_id for the DELETE.
      const toggleWatch = useCallback((listingOrId) => {
        const isObject = typeof listingOrId === "object" && listingOrId !== null;
        const id = isObject ? listingOrId.listing_id : listingOrId;
        const listing = isObject ? listingOrId : null;

        setWatchlist(prev => {
          const next = new Set(prev);
          const wasWatched = next.has(id);
          if (wasWatched) next.delete(id); else next.add(id);

          // Fire-and-forget backend sync. We've already updated the UI
          // optimistically; if the backend call fails, the next page load
          // will pull canonical state back from the server.
          if (wasWatched) {
            const entryId = entryIds.get(id);
            if (entryId != null) {
              apiDeleteWatchlist(entryId).then(ok => {
                if (ok) {
                  setEntryIds(prev => {
                    const next = new Map(prev);
                    next.delete(id);
                    return next;
                  });
                  setEntryDetails(prev => {
                    const next = new Map(prev);
                    next.delete(id);
                    return next;
                  });
                }
              });
            }
          } else if (listing) {
            // Optimistic entry (2026-07-15): the Set-max-bid button shows
            // the INSTANT the star is tapped — no waiting on the backend
            // round-trip (The client lag complaint). id=null marks it pending.
            setEntryDetails(prev => {
              const next = new Map(prev);
              if (!next.has(id)) {
                next.set(id, {
                  id: null,
                  domain: listing.domain,
                  max_bid_dollars: null,
                  is_armed: true,
                  status: "pending",
                  notify_enabled: false,  // reminders are opt-in per domain
                });
              }
              return next;
            });
            apiAddWatchlist(listing).then(entry => {
              if (!entry || entry.id == null) {
                // Backend add failed — roll back the placeholder so the
                // bid button doesn't point at nothing.
                pendingBidRef.current.delete(id);
                setEntryDetails(prev => {
                  const next = new Map(prev);
                  const d = next.get(id);
                  if (d && d.id == null) next.delete(id);
                  return next;
                });
                return;
              }
              if (entry && entry.id != null) {
                setEntryIds(prev => {
                  const next = new Map(prev);
                  next.set(id, entry.id);
                  return next;
                });
                setEntryDetails(prev => {
                  const next = new Map(prev);
                  next.set(id, {
                    id: entry.id,
                    domain: entry.domain || (listing && listing.domain),
                    max_bid_dollars: entry.max_bid_dollars,
                    is_armed: entry.is_armed,
                    status: entry.status,
                    notify_enabled: !!entry.notify_enabled,
                  });
                  return next;
                });
                // Apply a max bid the client typed during the optimistic window.
                const queued = pendingBidRef.current.get(id);
                if (queued) {
                  pendingBidRef.current.delete(id);
                  apiUpdateWatchlist(entry.id, queued).then(updated => {
                    if (updated && !updated.error) {
                      setEntryDetails(prev => {
                        const next = new Map(prev);
                        next.set(id, {
                          id: updated.id,
                          domain: updated.domain || entry.domain,
                          max_bid_dollars: updated.max_bid_dollars,
                          is_armed: updated.is_armed,
                          status: updated.status,
                          notify_enabled: !!updated.notify_enabled,
                        });
                        return next;
                      });
                    } else if (updated && updated.error) {
                      alert(updated.error);
                    }
                  });
                }
              }
            });
          }
          return next;
        });
      }, [entryIds]);

      // Estibot values by domain, fetched lazily for whatever's on screen
      // (2026-07-14: the client wants GD + Estibot side by side on EVERY card).
      // Map value null = "asked Estibot, no appraisal" so we don't refetch.
      const [ebValues, setEbValues] = useState(new Map());
      // In-flight guard: the 1s countdown tick recreates `visible` every
      // second, which used to re-fire this effect and send the SAME batch
      // to Estibot 5-6 times before the first response landed (seen in Fly
      // logs 2026-07-14). Domains listed here are awaiting a response and
      // must not be requested again.
      const ebInFlight = useRef(new Set());
      // Live overlay: domain -> {status, price, end_time_utc, ...} refreshed
      // every 60s for whatever's on screen. Stale feed prices get replaced;
      // sold/ended domains get tagged GONE instead of haunting the list.
      const visibleRef = useRef([]);
      // Max bids entered BEFORE the backend watchlist entry exists (the
      // optimistic-star window, ~1s). Applied automatically when the POST
      // returns. listingId -> patch.
      const pendingBidRef = useRef(new Map());
      useEffect(() => {
        const missing = [];
        for (const L of visible) {
          if (L.domain && !ebValues.has(L.domain) && !ebInFlight.current.has(L.domain)) {
            missing.push(L.domain);
          }
        }
        if (missing.length === 0) return;
        const t = setTimeout(async () => {
          const batch = missing.slice(0, 200);
          batch.forEach(d => ebInFlight.current.add(d));
          try {
            const values = await apiEstibotBatch(batch);
            if (!values) return;
            setEbValues(prev => {
              const next = new Map(prev);
              for (const d of batch) next.set(d, values[d] != null ? values[d] : null);
              return next;
            });
          } finally {
            batch.forEach(d => ebInFlight.current.delete(d));
          }
        }, 400);  // debounce scroll/tab churn
        return () => clearTimeout(t);
      }, [visible, ebValues]);

      // On-demand signals for the detail drawer (2026-08-26: Top Value rows
      // are now clickable, but ebValues only covers main-tab rows — fetch
      // the one domain being inspected if we don't have its signals yet).
      useEffect(() => {
        if (!selected || !selected.domain) return;
        if (ebValues.get(selected.domain)) return;
        let stop = false;
        (async () => {
          const sig = await apiEstibotBatch([selected.domain]);
          if (!sig || stop) return;
          setEbValues(prev => {
            const next = new Map(prev);
            next.set(selected.domain, sig[selected.domain] != null ? sig[selected.domain] : null);
            return next;
          });
        })();
        return () => { stop = true; };
      }, [selected]);

      visibleRef.current = visible;
      // Re-tick when the visible DOMAIN SET changes (search, tab switch,
      // scroll-load) — throttled to one call per 5s so keystrokes can't
      // hammer the availability API. The 60s interval still runs.
      const visKey = visible.slice(0, 50).map(L => L.domain).join(",");
      const lastLiveTickRef = useRef(0);
      useEffect(() => {
        if (!data) return;
        let cancelled = false;
        const tick = async () => {
          lastLiveTickRef.current = Date.now();
          const watchedDoms = new Set(
            Array.from(entryDetails.values()).map(det => det.domain).filter(Boolean)
          );
          // Coverage (2026-09-07: the client starred a batch from Top Value and
          // most sank into Old unverified): on the WATCHLIST tab, live-check
          // EVERY entry — not just the first 50 visible rows. Backend-only
          // stars sort last and never got polled, so they never got their
          // "alive" verdict. Chunked by 50 (the API's bulk cap), max 200.
          let doms = visibleRef.current.slice(0, 50).map(L => L.domain).filter(Boolean);
          if (tab === "watchlist") {
            doms = [...new Set([...doms, ...watchedDoms])].slice(0, 200);
          }
          if (doms.length === 0) return;
          for (let i = 0; i < doms.length; i += 50) {
            if (cancelled) return;
            const chunk = doms.slice(i, i + 50);
            // Watchlisted domains get the estimate cross-check ("gone" is
            // only believed after BOTH GoDaddy APIs agree — myhomebills).
            const live = await apiLiveBatch(chunk, chunk.filter(dm => watchedDoms.has(dm)));
            if (!live || cancelled) return;
            setLiveValues(prev => {
              const next = new Map(prev);
              for (const [dom, st] of Object.entries(live)) next.set(dom, { ...st, _at: Date.now() });
              return next;
            });
          }
        };
        const since = Date.now() - lastLiveTickRef.current;
        const t = setTimeout(tick, since >= 5000 ? 250 : 5000 - since);
        const iv = setInterval(tick, 60000);
        return () => { cancelled = true; clearTimeout(t); clearInterval(iv); };
      }, [data, tab, visKey, entryDetails]);

      // Live watchlist count — mirrors the WatchlistView Live/Old split so
      // the header badge and tab label only count auctions that are
      // plausibly still live (in today's feed, or verified via lookup, and
      // inside the 10-day expiry window). Old/relisted/ended entries render
      // in the "Old" section but don't inflate the number.
      const liveWatchCount = useMemo(() => {
        if (!data) return watchlist.size;
        const feedById = new Map(data.listings.map(L => [L.listing_id, L]));
        let n = 0;
        for (const id of watchlist) {
          const L = feedById.get(id);
          const fresh = freshLookups.get(id);
          const endRaw = (fresh && fresh.end_time_utc) || (L && L.end_time_utc);
          const endMs = endRaw ? new Date(endRaw).getTime() : null;
          const reason = watchRowOldReason({ inFeed: !!L, fresh, endMs, now });
          if (!reason) n++;
        }
        return n;
      }, [data, watchlist, freshLookups, now]);

      if (!data) {
        return <EmptyState
          loadFromFile={loadFromFile}
          loadFromUrl={loadFromUrl}
          error={loadError}
        />;
      }

      return (
        <div className="min-h-screen flex flex-col">
          {/* ONE sticky unit: title row + tabs together (The client 2026-07-15:
              "it should just be the whole thing"). */}
          <div className="sticky top-0 z-30 bg-white/95 backdrop-blur border-b border-slate-200">
            <Header
              data={data}
              watchlistSize={liveWatchCount}
              loadFromFile={loadFromFile}
              error={loadError}
              addByLookup={addByLookup}
            />
            <div className="max-w-4xl w-full mx-auto px-4">
              <Tabs
                tab={tab}
                setTab={setTab}
                watchlistSize={liveWatchCount}
              />
            </div>
          </div>
          <div className="max-w-4xl w-full mx-auto px-4 pb-24 flex-1">
            {tab !== "watchlist" && tab !== "top_value" && tab !== "gd_list" && tab !== "purchases" && (
              <TimeWindowChips windowId={windowId} setWindowId={setWindowId} />
            )}
            {tab !== "top_value" && tab !== "gd_list" && tab !== "purchases" && (
              <SubFilters
                search={search} setSearch={setSearch}
                theme={theme} setTheme={setTheme}
                typeFilter={typeFilter} setTypeFilter={setTypeFilter}
                sortBy={sortBy} setSortBy={setSortBy}
                themes={allThemes}
                total={visibleRows.length}
                visible={visible.length}
              />
            )}
            {tab === "purchases" ? (
              <PurchasesView />
            ) : tab === "gd_list" ? (
              <GDListView
                watchlist={watchlist}
                toggleWatch={toggleWatch}
                entryDetails={entryDetails}
                editMaxBid={editMaxBid}
                onClick={setSelected}
              />
            ) : tab === "top_value" ? (
              <TopValueView
                watchlist={watchlist}
                toggleWatch={toggleWatch}
                entryDetails={entryDetails}
                editMaxBid={editMaxBid}
                onClick={setSelected}
              />
            ) : tab === "watchlist" ? (
              <WatchlistView
                ebValues={ebValues}
                liveValues={liveValues}
                toggleNotify={toggleNotify}
                buyingIds={buyingIds}
                rows={visible}
                now={now}
                endedListingIds={endedListingIds}
                watchlist={watchlist}
                toggleWatch={toggleWatch}
                onClick={setSelected}
                entryDetails={entryDetails}
                editMaxBid={editMaxBid}
                buyNow={buyNow}
                freshLookups={freshLookups}
                refreshWatchlist={() => refreshWatchlist({ force: true })}
                refreshing={refreshingWatchlist}
              />
            ) : (
              <CardList
                rows={visible}
                now={now}
                endedListingIds={endedListingIds}
                watchlist={watchlist}
                toggleWatch={toggleWatch}
                onClick={setSelected}
                tab={tab}
                entryDetails={entryDetails}
                editMaxBid={editMaxBid}
                toggleNotify={toggleNotify}
                buyNow={buyNow}
                buyingIds={buyingIds}
                ebValues={ebValues}
                liveValues={liveValues}
              />
            )}
            {tab !== "top_value" && tab !== "gd_list" && tab !== "purchases" && visibleRows.length > visible.length && (
              <div className="text-center py-4">
                <button
                  onClick={() => setPageSize(n => n + 50)}
                  className="text-sm text-slate-700 underline hover:text-slate-900"
                >
                  Load more ({visibleRows.length - visible.length} more)
                </button>
              </div>
            )}
            {tab !== "top_value" && tab !== "gd_list" && tab !== "purchases" && visibleRows.length === 0 && (
              <EmptyTab tab={tab} hasFilters={!!(search || theme !== "all")} />
            )}
            {tab !== "watchlist" && tab !== "top_value" && tab !== "gd_list" && tab !== "purchases" && search.trim().length >= 3 && (
              <FullInventorySearch
                query={search.trim().toLowerCase()}
                localHits={visibleRows.length}
                watchlist={watchlist}
                toggleWatch={toggleWatch}
              />
            )}
          </div>
          {selected && (
            <DetailDrawer
              listing={selected}
              sig={selected ? ebValues.get(selected.domain) : null}
              onClose={() => setSelected(null)}
              isWatched={watchlist.has(selected.listing_id)}
              toggleWatch={() => toggleWatch(selected)}
              now={now}
            />
          )}
        </div>
      );
    }
