    // -----------------------------------------------------------------------
    // Full-inventory search ("why can't I find poly?" — the client, 2026-07-11)
    // -----------------------------------------------------------------------
    // The main search box filters the day's top-5,000 scored listings. This
    // component searches ALL ~935k listings via the backend index. Results
    // carry REAL listing ids, so starred hits are fully snipeable.

    async function apiSearchAll(q) {
      try {
        const r = await apiFetch(`/api/search?q=${encodeURIComponent(q)}&limit=50`);
        const body = await r.json().catch(() => ({}));
        if (!r.ok) return { error: body.detail || `Search failed (HTTP ${r.status})` };
        return body;
      } catch (e) {
        return { error: String(e) };
      }
    }

    function FullInventorySearch({ query, localHits, watchlist, toggleWatch }) {
      const [state, setState] = useState({ phase: "idle", results: null, error: null, forQuery: null });

      // Reset when the query changes so stale results don't linger.
      useEffect(() => {
        setState({ phase: "idle", results: null, error: null, forQuery: null });
      }, [query]);

      const run = async () => {
        setState({ phase: "loading", results: null, error: null, forQuery: query });
        const body = await apiSearchAll(query);
        if (body.error) {
          setState({ phase: "error", results: null, error: body.error, forQuery: query });
          return;
        }
        let results = body.results || [];
        // Exact-domain queries (2026-08-18: "the exact domain needs to just
        // be in search"): if the query looks like a full domain and the
        // index didn't have it, ask GoDaddy live and surface it on top.
        if (query.includes(".") && !results.some(r => r.domain === query)) {
          const live = await apiLookupDomain(query);
          if (live && live.found) {
            results = [{
              domain: live.domain || query,
              listing_id: live.listing_id || Date.now(),  // backend heals shims
              auction_type: live.auction_type || "EXPIRY_AUCTION",
              price: live.current_price_dollars != null ? String(live.current_price_dollars) : null,
              valuation: live.estimated_value_dollars != null ? String(live.estimated_value_dollars) : null,
              end_time_utc: live.end_time_utc,
              bid_count: live.bid_count || 0,
            }, ...results];
          }
        }
        // Live truth overlay (2026-08-25 buildultra: the index said ended,
        // GoDaddy said $5). One bulk availability call per search run.
        if (results.length > 0) {
          const liveMap = await apiLiveBatch(results.slice(0, 50).map(r => r.domain));
          if (liveMap) {
            results = results.map(r => {
              const lv = liveMap[r.domain];
              if (!lv) return r;
              const avail = lv.status === "AVAILABLE";
              return {
                ...r,
                _live: lv,
                price: avail && lv.price != null ? lv.price : r.price,
                end_time_utc: avail && lv.end_time_utc ? lv.end_time_utc : r.end_time_utc,
              };
            });
          }
        }
        setState({ phase: "done", results, error: null, forQuery: query });
      };

      const starShape = (r) => ({
        // Shape matches what apiAddWatchlist expects from a feed listing.
        listing_id: r.listing_id,
        domain: r.domain,
        auction_type: r.auction_type,
        current_price: r.price,
        estimated_value: r.valuation,
        end_time_utc: r.end_time_utc,
        bid_count: r.bid_count || 0,
        has_bids: (r.bid_count || 0) > 0,
      });

      return (
        <div className="mt-6 mb-2">
          {state.phase === "idle" && (
            <div className="text-center">
              <button
                onClick={run}
                className="text-sm px-3 py-2 rounded-md border border-slate-300 bg-white text-slate-700 hover:bg-slate-50 font-medium"
              >
                {query.includes(".")
                  ? <>Look up "{query}" on GoDaddy (exact + similar)</>
                  : localHits === 0
                    ? <>No matches in today's top list — search ALL of GoDaddy for "{query}"</>
                    : <>Search ALL 935k GoDaddy listings for "{query}"</>}
              </button>
            </div>
          )}
          {state.phase === "loading" && (
            <div className="text-center text-sm text-slate-500 py-3">Searching the full inventory…</div>
          )}
          {state.phase === "error" && (
            <div className="text-center text-sm text-amber-700 py-3">{state.error}</div>
          )}
          {state.phase === "done" && (
            <>
              <div className="text-[11px] uppercase tracking-wide text-slate-500 mb-1.5">
                Full inventory · {state.results.length} match{state.results.length === 1 ? "" : "es"} for "{state.forQuery}"
                {state.results.length >= 50 ? " (first 50)" : ""}
              </div>
              {state.results.length === 0 ? (
                <div className="text-center text-sm text-slate-500 py-3">
                  Nothing containing "{state.forQuery}" in any current GoDaddy auction.
                </div>
              ) : (
                <div className="bg-white rounded-lg border border-slate-200 overflow-hidden">
                  {state.results.map((r, i) => (
                    <div
                      key={r.listing_id}
                      className={`flex items-center gap-3 px-4 py-2.5 ${i === state.results.length - 1 ? "" : "border-b border-slate-100"}`}
                    >
                      <button
                        onClick={() => toggleWatch(starShape(r))}
                        aria-label={watchlist.has(r.listing_id) ? "Remove from watchlist" : "Add to watchlist"}
                        className={`text-lg flex-shrink-0 ${watchlist.has(r.listing_id) ? "text-amber-500" : "text-slate-300 hover:text-amber-400"}`}
                      >
                        {watchlist.has(r.listing_id) ? "★" : "☆"}
                      </button>
                      <BidTypeBadge auctionType={(r._live && r._live.status === "AVAILABLE" && liveEffectiveType(r._live)) || r.auction_type} />
                      <div className="font-semibold truncate" data-monospace>{r.domain}</div>
                      {r._live && r._live.status === "AVAILABLE" && (
                        <span className="text-[10px] px-1.5 py-0.5 rounded border bg-emerald-50 text-emerald-600 border-emerald-200 flex-shrink-0 font-semibold">LIVE</span>
                      )}
                      {r._live && r._live.status === "UNAVAILABLE" && (
                        <span className="text-[10px] px-1.5 py-0.5 rounded border bg-rose-50 text-rose-600 border-rose-200 flex-shrink-0 font-semibold">GONE</span>
                      )}
                      <div className="text-xs text-slate-500 flex-shrink-0 ml-auto flex items-center gap-2" data-monospace>
                        {r.price != null && <span>{formatPrice(r.price)}</span>}
                        {r.valuation != null && <span className="text-slate-400">· est {formatPrice(r.valuation)}</span>}
                      </div>
                    </div>
                  ))}
                </div>
              )}
              <div className="text-[11px] text-slate-400 mt-1.5 text-center">
                Star a result to watch it — full-inventory results aren't scored, but bids and Buy Now work normally.
              </div>
            </>
          )}
        </div>
      );
    }

    // -----------------------------------------------------------------------
    // Top Value tab — the client's daily "top 1,500 by GoDaddy valuation" scan
    // (2026-07-14 call). Pulls from the backend's full-inventory index, so
    // it ranks ALL ~935k listings by GoDaddy's dollar estimate, independent
    // of our scoring rubric. Results carry real listing ids (snipeable).
    // An Estibot column joins once their API access is unblocked.
    // -----------------------------------------------------------------------

    async function apiTopValue(offset, typeFilter, hours) {
      try {
        const params = new URLSearchParams({ limit: "100", offset: String(offset) });
        if (typeFilter && typeFilter !== "all") params.set("auction_type", typeFilter);
        if (hours && hours !== "all") params.set("within_hours", String(hours));
        const r = await apiFetch(`/api/search/top-value?${params}`);
        const body = await r.json().catch(() => ({}));
        if (!r.ok) return { error: body.detail || `Failed (HTTP ${r.status})` };
        return body;
      } catch (e) {
        return { error: String(e) };
      }
    }

    // Top Value results cache — switching tabs unmounts the view; without
    // this, every visit refetched from the backend (latency fix).
    const _topValueCache = new Map();  // typeFilter -> {at, rows}
    const TOP_VALUE_CACHE_MS = 5 * 60 * 1000;

    async function apiLiveBatch(domains, verifyDomains) {
      // Live listing truth (The client 2026-08-23: "nothing feeds it
      // continuously"). Bulk 50 via the official availability API.
      // verifyDomains (2026-08-25 myhomebills lie-detector): watchlisted
      // domains get an estimate-API cross-check server-side, because the
      // availability endpoint said UNAVAILABLE while godaddy.com sold the
      // domain at $5. Keep this list to starred domains only.
      try {
        let url = `/api/search/live?d=${encodeURIComponent(domains.join(","))}`;
        if (verifyDomains && verifyDomains.length > 0) {
          url += `&verify=${encodeURIComponent(verifyDomains.join(","))}`;
        }
        const r = await apiFetch(url);
        if (!r.ok) return null;
        const body = await r.json().catch(() => null);
        return body && body.live ? body.live : null;
      } catch { return null; }
    }

    async function apiEstibotBatch(domains) {
      // 2026-08-19: upgraded to the /signals endpoint — same batching, but
      // each domain now carries { estibot, indexed_pages, exact_match_tlds,
      // developed_tlds, renewal_est } for the cards and detail popup.
      try {
        const r = await apiFetch(`/api/search/signals?d=${encodeURIComponent(domains.join(","))}`);
        if (!r.ok) return null;
        const body = await r.json().catch(() => null);
        return body && body.signals ? body.signals : null;
      } catch { return null; }
    }

    // Time windows for Top Value (The client 2026-07-15: "the most urgent are
    // the ones expiring sooner than later").
    const TOP_VALUE_WINDOWS = [
      { id: "1",   label: "1h" },
      { id: "11",  label: "11h" },
      { id: "24",  label: "1 day" },
      { id: "48",  label: "2 days" },
      { id: "72",  label: "3 days" },
      { id: "168", label: "7 days" },
      { id: "all", label: "All" },
    ];

    async function apiPurchases() {
      try {
        const r = await apiFetch(`/api/purchases?limit=100`);
        if (!r.ok) return null;
        return await r.json().catch(() => null);
      } catch { return null; }
    }

    const OUTCOME_STYLE = {
      won:       "bg-emerald-50 text-emerald-700 border-emerald-300",
      dry_run:   "bg-slate-50 text-slate-500 border-slate-200",
      in_flight: "bg-amber-50 text-amber-700 border-amber-300",
      outbid:    "bg-sky-50 text-sky-700 border-sky-200",
      lost:      "bg-rose-50 text-rose-600 border-rose-200",
      error:     "bg-rose-50 text-rose-700 border-rose-300",
      expired:   "bg-slate-50 text-slate-400 border-slate-200",
    };

    function PurchasesView() {
      const [rows, setRows] = useState(null);
      const [error, setError] = useState(false);
      useEffect(() => {
        (async () => {
          const r = await apiPurchases();
          if (r) setRows(r); else setError(true);
        })();
      }, []);
      if (error) return <div className="text-center text-sm text-amber-700 py-8">Couldn't load purchases — check your connection.</div>;
      if (rows == null) return <div className="text-center text-sm text-slate-500 py-8">Loading purchase history…</div>;
      if (rows.length === 0) return <div className="text-center text-sm text-slate-500 py-8">No purchase attempts yet — the ledger fills as bids and buys fire.</div>;
      return (
        <div className="bg-white rounded-lg border border-slate-200 overflow-hidden">
          {rows.map((p, i) => (
            <div key={p.id} className={`px-4 py-3 ${i === rows.length - 1 ? "" : "border-b border-slate-100"}`}>
              <div className="flex items-center gap-2 flex-wrap">
                <span className={`text-[10px] font-semibold uppercase tracking-wider px-1.5 py-0.5 rounded border ${OUTCOME_STYLE[p.outcome] || OUTCOME_STYLE.expired}`}>
                  {p.outcome.replace("_", " ")}
                </span>
                <span className="text-[10px] text-slate-400 uppercase">{p.action_type === "CLOSEOUT_BUY" ? "Buy Now" : "Bid"}</span>
                <span className="font-semibold" data-monospace>{p.domain}</span>
                <span className="font-medium text-slate-800" data-monospace>{formatPrice(p.amount_dollars)}</span>
                <span className="text-xs text-slate-400 ml-auto" data-monospace>
                  {new Date(p.fired_at).toLocaleString()}
                </span>
              </div>
              {(p.godaddy_order_id || p.detail) && (
                <div className="text-[11px] text-slate-500 mt-1" data-monospace>
                  {p.godaddy_order_id && <>Order {p.godaddy_order_id} · </>}
                  {p.detail}
                </div>
              )}
            </div>
          ))}
        </div>
      );
    }

    // Inline max-bid chip for list rows (2026-09-24 the client call: starring
    // in Top Value / GD List gave no way to set the bid without hopping to
    // the watchlist tab). Same rules as the Card: unknown != absent — show
    // "loading bid…" until the entry detail is confirmed, never "+ max bid".
    function RowMaxBidChip({ listingId, auctionType, watchlist, entryDetails, editMaxBid }) {
      if (!editMaxBid || !watchlist.has(listingId)) return null;
      const det = entryDetails?.get(listingId);
      if (!det) {
        return (
          <span className="text-[10px] px-1.5 py-0.5 rounded border bg-slate-50 text-slate-400 border-slate-200 flex-shrink-0">
            loading bid…
          </span>
        );
      }
      const isClose = auctionType === "CLOSEOUT";
      const mb = det.max_bid_dollars;
      return (
        <button
          onClick={(e) => { e.stopPropagation(); editMaxBid(listingId, auctionType); }}
          aria-label="Set max bid"
          className={`text-[10px] px-1.5 py-0.5 rounded border flex-shrink-0 font-medium transition ${
            mb != null
              ? "bg-indigo-50 text-indigo-900 border-indigo-200 hover:bg-indigo-100"
              : "bg-slate-50 text-slate-600 border-slate-200 hover:bg-slate-100"
          }`}
        >
          {isClose
            ? (mb != null ? <>Auto-buy ≤ {formatPrice(mb)}</> : <>+ Set auto-buy</>)
            : (mb != null ? <>Max {formatPrice(mb)}</> : <>+ Set max bid</>)}
        </button>
      );
    }

    function TopValueView({ watchlist, toggleWatch, entryDetails, editMaxBid, onClick }) {
      const [typeFilter, setTypeFilter] = useState("all");
      const [hours, setHours] = useState("all");
      const now = useTick();
      const cacheKey = typeFilter + "|" + hours;
      const cached = _topValueCache.get(cacheKey);
      const cacheFresh = cached && (Date.now() - cached.at) < TOP_VALUE_CACHE_MS;
      const [rows, setRows] = useState(cacheFresh ? cached.rows : []);
      const [phase, setPhase] = useState(cacheFresh ? "done" : "loading");
      const [error, setError] = useState(null);

      const load = async (offset, replace) => {
        setPhase("loading");
        const body = await apiTopValue(offset, typeFilter, hours);
        if (body.error) {
          setError(body.error);
          setPhase("error");
          return;
        }
        setRows(prev => {
          const next = replace ? body.results : [...prev, ...body.results];
          _topValueCache.set(cacheKey, { at: Date.now(), rows: next });
          return next;
        });
        setPhase("done");
      };

      useEffect(() => {
        const c = _topValueCache.get(cacheKey);
        if (c && (Date.now() - c.at) < TOP_VALUE_CACHE_MS) {
          setRows(c.rows);
          setPhase("done");
          return;
        }
        load(0, true);
      }, [cacheKey]);

      const starShape = (r) => ({
        listing_id: r.listing_id,
        domain: r.domain,
        auction_type: r.auction_type,
        current_price: r.price,
        estimated_value: r.valuation,
        end_time_utc: r.end_time_utc,
        bid_count: r.bid_count || 0,
        has_bids: (r.bid_count || 0) > 0,
      });

      // Live overlay (2026-08-26, "EVERYTHING NEEDS TO BE LIVE"): the index
      // is up to 12h stale — sold rows lingered and prices lagged. Check
      // the top 100 against the availability API on load and every 60s.
      const [liveMap, setLiveMap] = useState(new Map());
      useEffect(() => {
        if (rows.length === 0) return;
        let stop = false;
        const check = async () => {
          const doms = rows.slice(0, 100).map(r => r.domain).filter(Boolean);
          for (let i = 0; i < doms.length; i += 50) {
            if (stop) return;
            const chunk = await apiLiveBatch(doms.slice(i, i + 50));
            if (!chunk || stop) return;
            setLiveMap(prev => {
              const next = new Map(prev);
              for (const [d, st] of Object.entries(chunk)) next.set(d, st);
              return next;
            });
          }
        };
        check();
        const iv = setInterval(check, 60000);
        return () => { stop = true; clearInterval(iv); };
      }, [rows]);

      return (
        <div>
          <div className="mb-3 flex gap-2 flex-wrap">
            {TOP_VALUE_WINDOWS.map(w => (
              <button
                key={w.id}
                onClick={() => setHours(w.id)}
                className={`text-xs px-3 py-1.5 rounded-full border transition ${
                  hours === w.id
                    ? "bg-slate-900 text-white border-slate-900"
                    : "bg-white text-slate-700 hover:bg-slate-50 border-slate-200"
                }`}
              >
                {w.label}
              </button>
            ))}
          </div>
          <div className="flex items-center justify-between mb-3">
            <div className="text-xs text-slate-500">
              All 935k listings ranked by GoDaddy valuation · EB = Estibot (amber = $1k+)
            </div>
            <select
              value={typeFilter}
              onChange={e => setTypeFilter(e.target.value)}
              className="text-xs px-2 py-1.5 border rounded-md bg-white"
            >
              <option value="all">Bid + Buy Now</option>
              <option value="EXPIRY_AUCTION">Bid only</option>
              <option value="CLOSEOUT">Buy Now only</option>
            </select>
          </div>
          {phase === "error" && (
            <div className="text-center text-sm text-amber-700 py-6">{error}</div>
          )}
          {rows.length > 0 && (
            <div className="bg-white rounded-lg border border-slate-200 overflow-hidden">
              {rows.map((r, i) => {
                const lv = liveMap.get(r.domain);
                const isGone = lv && lv.status === "UNAVAILABLE";
                const livePrice = lv && lv.status === "AVAILABLE" && lv.price != null ? lv.price : r.price;
                // Live end time beats the index's (rung changes, extensions).
                const endIso = (lv && lv.status === "AVAILABLE" && lv.end_time_utc) ? lv.end_time_utc : r.end_time_utc;
                const endMs = endIso ? new Date(endIso).getTime() : null;
                const remainingMs = endMs != null ? endMs - now : null;
                // GoDaddy's ACTUAL renewal price rides along on the live check.
                const renewal = lv && lv.renewal != null ? lv.renewal : null;
                // Live type beats the index (cookent: index said Buy Now,
                // live said BID). Price evidence beats the label (dellport:
                // $50 buy-now under an "expiry" listingType). Stored on
                // star -> correct worker routing.
                const liveType = (lv && lv.status === "AVAILABLE")
                  ? liveEffectiveType(lv) : null;
                const rShape = {
                  ...starShape(r),
                  auction_type: liveType || r.auction_type,
                  current_price: livePrice,
                  end_time_utc: endIso,
                };
                return (
                <div
                  key={r.listing_id}
                  onClick={() => onClick && onClick(rShape)}
                  className={`flex items-center gap-3 px-4 py-2.5 cursor-pointer hover:bg-slate-50 transition ${isGone ? "opacity-50" : ""} ${i === rows.length - 1 ? "" : "border-b border-slate-100"}`}
                >
                  <span className="text-[10px] text-slate-400 w-7 text-right flex-shrink-0" data-monospace>{i + 1}</span>
                  <button
                    onClick={(e) => { e.stopPropagation(); toggleWatch(rShape); }}
                    aria-label={watchlist.has(r.listing_id) ? "Remove from watchlist" : "Add to watchlist"}
                    className={`text-lg flex-shrink-0 ${watchlist.has(r.listing_id) ? "text-amber-500" : "text-slate-300 hover:text-amber-400"}`}
                  >
                    {watchlist.has(r.listing_id) ? "★" : "☆"}
                  </button>
                  <BidTypeBadge auctionType={liveType || r.auction_type} />
                  <div className="font-semibold truncate" data-monospace>{r.domain}</div>
                  <RowMaxBidChip listingId={r.listing_id} auctionType={liveType || r.auction_type}
                    watchlist={watchlist} entryDetails={entryDetails} editMaxBid={editMaxBid} />
                  {lv && lv.already_bidding && !isGone && (
                    <span title={`You already have a bid on GoDaddy (${lv.member_bidding_status || "bidding"}). The sniper will not fire on this.`}
                      className="text-[10px] px-1.5 py-0.5 rounded border bg-rose-100 text-rose-700 border-rose-400 flex-shrink-0 font-bold">⚠ YOUR BID</span>
                  )}
                  {isGone && (
                    <span className="text-[10px] px-1.5 py-0.5 rounded border bg-rose-50 text-rose-600 border-rose-200 flex-shrink-0 font-semibold">GONE</span>
                  )}
                  <div className="text-xs flex-shrink-0 ml-auto flex items-center gap-2" data-monospace>
                    <span className="text-emerald-500">GD est <span className="font-semibold text-emerald-600">{formatPrice(r.valuation)}</span></span>
                    {r.estibot_value != null && (
                      // The client's rule (2026-07-14 call): Estibot >= $1,000
                      // is a flag worth attention — he can resell on the
                      // strength of the Estibot number alone.
                      <span className={`px-1.5 py-0.5 rounded border text-[10px] ${
                        Number(r.estibot_value) >= 1000
                          ? "bg-amber-50 text-amber-800 border-amber-300 font-semibold"
                          : "bg-slate-50 text-slate-500 border-slate-200"
                      }`}>
                        EB {formatPrice(r.estibot_value)}
                      </span>
                    )}
                    {livePrice != null && !isGone && <span className="text-slate-500">· {formatPrice(livePrice)} now</span>}
                    {/* renewal dropped from the main line 2026-09-24 (drawer still has it) */}
                    {(r.bid_count || 0) > 0 && !isGone && <span className="text-slate-400">· {r.bid_count} bids</span>}
                    {remainingMs != null && remainingMs > 0 && !isGone && (
                      <span className={`font-medium ${urgencyClass(remainingMs)}`}>· {formatRemaining(remainingMs)}</span>
                    )}
                  </div>
                </div>
                );
              })}
            </div>
          )}
          {phase === "loading" && (
            <div className="text-center text-sm text-slate-500 py-6">Loading highest valuations…</div>
          )}
          {phase === "done" && rows.length > 0 && rows.length < 1500 && (
            <div className="text-center py-4">
              <button
                onClick={() => load(rows.length, false)}
                className="text-sm text-slate-700 underline hover:text-slate-900"
              >
                Load more (showing {rows.length})
              </button>
            </div>
          )}
        </div>
      );
    }

    // -----------------------------------------------------------------------
    // GD List tab — GoDaddy's expiring list, mirrored exactly (The client,
    // 2026-09-19 call). His hour-a-day ritual runs on GoDaddy's raw list in
    // end-time order; the sniper's curated views made him feel he was
    // missing 90-95% of what he'd bid on (dentl.com never surfaced). This
    // tab is that list — every domain, no scoring, no floors, no allowlist —
    // with his trusted columns alongside: GD est, Estibot, pages indexed.
    // The day-range picker is the isolation GoDaddy can't do ("only day 3
    // to day 4 — I already combed the earlier days").
    // -----------------------------------------------------------------------

    async function apiGdList(offset, typeFilter, fromH, toH) {
      try {
        const params = new URLSearchParams({ limit: "100", offset: String(offset), from_hours: String(fromH) });
        if (toH != null) params.set("to_hours", String(toH));
        if (typeFilter && typeFilter !== "all") params.set("auction_type", typeFilter);
        const r = await apiFetch(`/api/search/gd-list?${params}`);
        const body = await r.json().catch(() => ({}));
        if (!r.ok) return { error: body.detail || `Failed (HTTP ${r.status})` };
        return body;
      } catch (e) { return { error: String(e) }; }
    }

    const GD_LIST_PRESETS = [
      { id: "1h",  label: "1h",     from: 0, to: 1 },
      { id: "11h", label: "11h",    from: 0, to: 11 },
      { id: "1d",  label: "1 day",  from: 0, to: 24 },
      { id: "2d",  label: "2 days", from: 0, to: 48 },
      { id: "3d",  label: "3 days", from: 0, to: 72 },
      { id: "7d",  label: "7 days", from: 0, to: 168 },
      { id: "all", label: "All",    from: 0, to: null },
    ];

    function GDListView({ watchlist, toggleWatch, entryDetails, editMaxBid, onClick }) {
      const [typeFilter, setTypeFilter] = useState("all");
      const [preset, setPreset] = useState("1d");
      // Custom day range (The client's plane workflow): day 3 -> day 4 means
      // from_hours=72, to_hours=96. Empty = presets rule.
      const [dayFrom, setDayFrom] = useState("");
      const [dayTo, setDayTo] = useState("");
      const [applied, setApplied] = useState(null);  // {from, to} hours when custom active
      const now = useTick();
      const [rows, setRows] = useState([]);
      const [phase, setPhase] = useState("loading");
      const [error, setError] = useState(null);
      const [spMap, setSpMap] = useState(new Map());

      const range = applied || (() => {
        const p = GD_LIST_PRESETS.find(x => x.id === preset) || GD_LIST_PRESETS[2];
        return { from: p.from, to: p.to };
      })();

      const load = async (offset, replace) => {
        setPhase("loading");
        const body = await apiGdList(offset, typeFilter, range.from, range.to);
        if (body.error) { setError(body.error); setPhase("error"); return; }
        const incoming = body.results || [];
        setRows(prev => replace ? incoming : [...prev, ...incoming]);
        setPhase("done");
        // SP flags for the new slice (batch through /signals).
        const doms = incoming.map(r => r.domain).filter(Boolean);
        for (let i = 0; i < doms.length; i += 200) {
          const sig = await apiEstibotBatch(doms.slice(i, i + 200));
          if (!sig) continue;
          setSpMap(prev => {
            const next = new Map(prev);
            for (const [d, s] of Object.entries(sig)) if (s && s.sp) next.set(d, s.sp);
            return next;
          });
        }
      };

      useEffect(() => { load(0, true); }, [typeFilter, preset, applied]);

      // Live overlay — same 60s truth as everywhere else.
      const [liveMap, setLiveMap] = useState(new Map());
      useEffect(() => {
        if (rows.length === 0) return;
        let stop = false;
        const check = async () => {
          const doms = rows.slice(0, 100).map(r => r.domain).filter(Boolean);
          for (let i = 0; i < doms.length; i += 50) {
            if (stop) return;
            const chunk = await apiLiveBatch(doms.slice(i, i + 50));
            if (!chunk || stop) return;
            setLiveMap(prev => {
              const next = new Map(prev);
              for (const [d, st] of Object.entries(chunk)) next.set(d, st);
              return next;
            });
          }
        };
        check();
        const iv = setInterval(check, 60000);
        return () => { stop = true; clearInterval(iv); };
      }, [rows]);

      const applyDays = () => {
        const f = parseFloat(dayFrom), t = parseFloat(dayTo);
        if (isNaN(f) || isNaN(t) || f < 0 || t <= f) {
          alert("Day range: 'from' must be 0 or more and 'to' must be after it. Example: from 3, to 4.");
          return;
        }
        setApplied({ from: f * 24, to: t * 24 });
      };

      const starShape = (r, liveType, livePrice, endIso) => ({
        listing_id: r.listing_id,
        domain: r.domain,
        auction_type: liveType || r.auction_type,
        current_price: livePrice,
        estimated_value: r.valuation,
        end_time_utc: endIso,
        bid_count: r.bid_count || 0,
        has_bids: (r.bid_count || 0) > 0,
      });

      return (
        <div>
          <div className="mb-3 flex gap-2 flex-wrap items-center">
            {GD_LIST_PRESETS.map(w => (
              <button
                key={w.id}
                onClick={() => { setApplied(null); setPreset(w.id); }}
                className={`text-xs px-3 py-1.5 rounded-full border transition ${
                  !applied && preset === w.id
                    ? "bg-slate-900 text-white border-slate-900"
                    : "bg-white text-slate-700 hover:bg-slate-50 border-slate-200"
                }`}
              >
                {w.label}
              </button>
            ))}
            <span className="text-xs text-slate-400 ml-2">or day</span>
            <input value={dayFrom} onChange={e => setDayFrom(e.target.value)} placeholder="3"
              className={`w-12 text-xs px-2 py-1.5 border rounded-md ${applied ? "border-slate-900" : ""}`} />
            <span className="text-xs text-slate-400">to</span>
            <input value={dayTo} onChange={e => setDayTo(e.target.value)} placeholder="4"
              className={`w-12 text-xs px-2 py-1.5 border rounded-md ${applied ? "border-slate-900" : ""}`} />
            <button onClick={applyDays}
              className={`text-xs px-3 py-1.5 rounded-md border font-medium ${
                applied ? "bg-slate-900 text-white border-slate-900" : "bg-white text-slate-700 hover:bg-slate-50 border-slate-200"
              }`}>
              Apply
            </button>
          </div>
          <div className="flex items-center justify-between mb-3">
            <div className="text-xs text-slate-500">
              GoDaddy's expiring list, mirrored — every domain, end-time order, no filters
              {applied && <> · showing day {applied.from / 24} to day {applied.to / 24}</>}
            </div>
            <select
              value={typeFilter}
              onChange={e => setTypeFilter(e.target.value)}
              className="text-xs px-2 py-1.5 border rounded-md bg-white"
            >
              <option value="all">Bid + Buy Now</option>
              <option value="EXPIRY_AUCTION">Bid only</option>
              <option value="CLOSEOUT">Buy Now only</option>
            </select>
          </div>
          {phase === "error" && (
            <div className="text-center text-sm text-amber-700 py-6">{error}</div>
          )}
          {rows.length > 0 && (
            <div className="bg-white rounded-lg border border-slate-200 overflow-hidden">
              {rows.map((r, i) => {
                const lv = liveMap.get(r.domain);
                const isGone = lv && lv.status === "UNAVAILABLE";
                const livePrice = lv && lv.status === "AVAILABLE" && lv.price != null ? lv.price : r.price;
                const endIso = (lv && lv.status === "AVAILABLE" && lv.end_time_utc) ? lv.end_time_utc : r.end_time_utc;
                const endMs = endIso ? new Date(endIso).getTime() : null;
                const remainingMs = endMs != null ? endMs - now : null;
                const liveType = (lv && lv.status === "AVAILABLE") ? liveEffectiveType(lv) : null;
                const sp = spMap.get(r.domain);
                const rShape = starShape(r, liveType, livePrice, endIso);
                return (
                <div
                  key={`${r.listing_id}-${i}`}
                  onClick={() => onClick && onClick(rShape)}
                  className={`flex items-center gap-3 px-4 py-2.5 cursor-pointer hover:bg-slate-50 transition ${isGone ? "opacity-50" : ""} ${i === rows.length - 1 ? "" : "border-b border-slate-100"}`}
                >
                  <span className="text-[10px] text-slate-400 w-7 text-right flex-shrink-0" data-monospace>{i + 1}</span>
                  <button
                    onClick={(e) => { e.stopPropagation(); toggleWatch(rShape); }}
                    aria-label={watchlist.has(r.listing_id) ? "Remove from watchlist" : "Add to watchlist"}
                    className={`text-lg flex-shrink-0 ${watchlist.has(r.listing_id) ? "text-amber-500" : "text-slate-300 hover:text-amber-400"}`}
                  >
                    {watchlist.has(r.listing_id) ? "★" : "☆"}
                  </button>
                  <BidTypeBadge auctionType={liveType || r.auction_type} />
                  <div className="font-semibold truncate" data-monospace>{r.domain}</div>
                  <RowMaxBidChip listingId={r.listing_id} auctionType={liveType || r.auction_type}
                    watchlist={watchlist} entryDetails={entryDetails} editMaxBid={editMaxBid} />
                  {lv && lv.already_bidding && !isGone && (
                    <span title={`You already have a bid on GoDaddy (${lv.member_bidding_status || "bidding"}). The sniper will not fire on this.`}
                      className="text-[10px] px-1.5 py-0.5 rounded border bg-rose-100 text-rose-700 border-rose-400 flex-shrink-0 font-bold">⚠ YOUR BID</span>
                  )}
                  {sp && (
                    <span title={`Possible misspelling: ${sp}`} className="text-[10px] px-1.5 py-0.5 rounded border bg-orange-50 text-orange-700 border-orange-300 flex-shrink-0 font-bold">SP?</span>
                  )}
                  {isGone && (
                    <span className="text-[10px] px-1.5 py-0.5 rounded border bg-rose-50 text-rose-600 border-rose-200 flex-shrink-0 font-semibold">GONE</span>
                  )}
                  <div className="text-xs flex-shrink-0 ml-auto flex items-center gap-2" data-monospace>
                    {r.valuation != null && (
                      <span className="text-emerald-500">GD est <span className="font-semibold text-emerald-600">{formatPrice(r.valuation)}</span></span>
                    )}
                    {r.estibot_value != null && (
                      <span className={`px-1.5 py-0.5 rounded border text-[10px] ${
                        Number(r.estibot_value) >= 1000
                          ? "bg-amber-50 text-amber-800 border-amber-300 font-semibold"
                          : "bg-slate-50 text-slate-500 border-slate-200"
                      }`}>
                        EB {formatPrice(r.estibot_value)}
                      </span>
                    )}
                    {r.indexed_pages != null && <span className="text-slate-400">· {r.indexed_pages.toLocaleString()} pg</span>}
                    {livePrice != null && !isGone && <span className="text-slate-500">· {formatPrice(livePrice)} now</span>}
                    {(r.bid_count || 0) > 0 && !isGone && <span className="text-slate-400">· {r.bid_count} bids</span>}
                    {remainingMs != null && remainingMs > 0 && !isGone && (
                      <span className={`font-medium ${urgencyClass(remainingMs)}`}>· {formatRemaining(remainingMs)}</span>
                    )}
                  </div>
                </div>
                );
              })}
            </div>
          )}
          {phase === "loading" && (
            <div className="text-center text-sm text-slate-500 py-6">Loading GoDaddy's list…</div>
          )}
          {phase === "done" && rows.length === 0 && (
            <div className="text-center text-sm text-slate-500 py-6">Nothing expiring in this window.</div>
          )}
          {phase === "done" && rows.length > 0 && (
            <div className="text-center py-4">
              <button
                onClick={() => load(rows.length, false)}
                className="text-sm text-slate-700 underline hover:text-slate-900"
              >
                Load more (showing {rows.length})
              </button>
            </div>
          )}
        </div>
      );
    }

    // -----------------------------------------------------------------------
    // Watchlist liveness classification
    // -----------------------------------------------------------------------
    // GoDaddy expiry auctions run at most 10 days. Anything on the watchlist
    // showing a longer runway is NOT the auction the client starred — the domain
    // ended and was relisted by its owner/a reseller (60-90 day seller
    // listings with asking prices). Those, plus ended/not-found entries, get
    // bucketed as "Old" and excluded from the live watchlist count.
    const EXPIRY_WINDOW_MS = 10.5 * 24 * 3600 * 1000;  // 10 days + buffer

    // Returns null if the row is a live, original auction; otherwise a short
    // human-readable reason for why it's in the Old bucket.
    function watchRowOldReason({ inFeed, fresh, endMs, now }) {
      if (fresh && fresh.found === false) return "No longer in auction";
      if (endMs != null && endMs <= now) return "Ended";
      if (endMs != null && endMs - now > EXPIRY_WINDOW_MS) return "Relisted — not the original auction";
      // No feed row and no lookup yet = freshly starred from full-inventory
      // search. That's LIVE-until-proven-dead (it lands in Old only if the
      // lookup comes back not-found), so it must not vanish into the Old
      // bucket the moment the client stars it.
      return null;
    }

    // -----------------------------------------------------------------------
    // Card list (the meat of the dashboard)
    // -----------------------------------------------------------------------

    // Watchlist tab gets its own renderer that splits Active vs Expired into
    // two sub-sections so the client can review what he was watching that timed
    // out (per a 5/29 review). Active items render exactly like other tabs;
    // Expired items get a subtle visual treatment (lighter, "Expired" tag).
    function WatchlistView({ rows, now, endedListingIds, watchlist, toggleWatch, onClick, entryDetails, editMaxBid, toggleNotify, buyNow, buyingIds, ebValues, liveValues, freshLookups, refreshWatchlist, refreshing }) {
      // Merge fresh GoDaddy lookup data (refreshed on tab-open) over the
      // static data-sync values. The client 2026-06-03: he was bidding live and
      // our dashboard still showed yesterday's bid amount. The fresh data
      // gives current_price + bid_count straight from GoDaddy.
      const mergedRows = rows.map(L => {
        const fresh = freshLookups?.get(L.listing_id);
        if (!fresh) return L;
        return {
          ...L,
          current_price: fresh.current_price != null
            ? String(fresh.current_price)
            : L.current_price,
          bid_count: fresh.bid_count != null ? fresh.bid_count : L.bid_count,
          has_bids: fresh.bid_count != null
            ? fresh.bid_count > 0
            : L.has_bids,
          end_time_utc: fresh.end_time_utc || L.end_time_utc,
          // GD-est fix (2026-07-15): the lookup returns GoDaddy's estimate;
          // it was being dropped here, so Old/backend-only rows showed EB
          // but no GD number (The client's demo confusion).
          estimated_value: L.estimated_value != null ? L.estimated_value
            : (fresh.estimated_value != null ? String(fresh.estimated_value) : null),
          _fresh_refreshed_at: fresh.refreshed_at,
        };
      });

      // Old section hidden by default (The client 2026-08-19: doesn't want to
      // see expired watchlist items). One tap reveals them when needed.
      const [showOld, setShowOld] = useState(false);
      const active = [];
      const armedWatches = [];
      const expired = [];
      for (const L of mergedRows) {
        const endMs = L.end_time_utc ? new Date(L.end_time_utc).getTime() : null;
        // 2026-08-25 (buildultra): GoDaddy's live answer beats every feed-
        // derived "old" heuristic. AVAILABLE -> Live section, full stop —
        // the Card overlay shows the current rung's price and countdown.
        // Explicit UNAVAILABLE -> Old, even if the feed clock says active.
        const lv = liveValues ? liveValues.get(L.domain) : null;
        if (lv && lv.status === "AVAILABLE") {
          active.push(L);
          continue;
        }
        if (endedListingIds.has(L.listing_id)) {
          active.push(L);  // mid fade-out animation; leave in place
          continue;
        }
        const fresh = freshLookups?.get(L.listing_id);
        const det = entryDetails ? entryDetails.get(L.listing_id) : null;
        // Armed auto-buy on a CLOSEOUT = the worker is watching for the
        // next rung of the price ladder. That earns its own section below
        // Live. BID auctions don't ladder back (Adam 2026-08-26: "the auto
        // buy armed waiting for come back is for buy nows that drop
        // prices, not auctions") — a gone BID goes to Old, armed or not.
        // CLOSEOUT rows qualify. Backend-only rows qualify ONLY if starred
        // in the last 7 days: that's a fresh lapse waiting for its closeout
        // conversion (finacredit pattern) — NOT June's dead BID entries,
        // which flooding back into this section was this morning's bug.
        const _detAgeMs = det && det.created_at ? (now - new Date(det.created_at).getTime()) : Infinity;
        const armedWatch = !!(det && det.is_armed && det.max_bid_dollars != null && det.status === "pending")
          && (L.auction_type === "CLOSEOUT" || (L._backend_only === true && _detAgeMs < 7 * 24 * 3600 * 1000));
        const reason = watchRowOldReason({
          inFeed: !L._backend_only,
          fresh,
          endMs,
          now,
        }) || (lv && lv.status === "UNAVAILABLE" ? "gone (live check)" : null);
        if (reason) {
          if (armedWatch) {
            armedWatches.push({ ...L, _armed_watch: true });
          } else {
            expired.push({ ...L, _old_reason: reason });
          }
        } else if (L._backend_only && !fresh) {
          // Not in today's feed and not verified yet. The client must NOT see
          // a wall of "checking live status" spinners — only entries
          // starred in the last 5 minutes earn a checking chip in Live;
          // stale unknowns wait quietly behind "Show old" until a lookup
          // or the live poll proves them alive.
          // det can lag a beat right after starring (entryDetails refetch
          // in flight). No det = brand-new by definition — treat as fresh,
          // NOT ancient (2026-08-26 minecraftia: a just-starred Top Value
          // domain landed in Old as "not live in feed" for one render).
          const ageMs = det && det.created_at
            ? (now - new Date(det.created_at).getTime())
            : 0;
          if (ageMs <= 5 * 60 * 1000) {
            active.push({ ...L, _verifying: true });
          } else {
            expired.push({ ...L, _old_reason: "not live in feed" });
          }
        } else {
          active.push(L);
        }
      }

      // Most-recent refresh timestamp across all watched items.
      const latestRefresh = Array.from(freshLookups?.values() || []).reduce(
        (acc, v) => Math.max(acc, v.refreshed_at || 0),
        0
      );
      const refreshAgeSec = latestRefresh
        ? Math.floor((now - latestRefresh) / 1000)
        : null;
      // Expired sub-sort by recency (most recently ended first).
      expired.sort((a, b) => {
        const am = a.end_time_utc ? new Date(a.end_time_utc).getTime() : 0;
        const bm = b.end_time_utc ? new Date(b.end_time_utc).getTime() : 0;
        return bm - am;
      });
      return (
        <>
          {/* Refresh status bar — the client wants to see live GD state without leaving our app */}
          {(active.length > 0 || expired.length > 0) && (
            <div className="flex items-center justify-between mb-3 text-xs">
              <div className="text-slate-500">
                {latestRefresh > 0 ? (
                  <>Live data from GoDaddy · refreshed {refreshAgeSec}s ago</>
                ) : (
                  <>Using cached data from last daily sync</>
                )}
              </div>
              <button
                onClick={refreshWatchlist}
                disabled={refreshing}
                className={`px-2 py-1 border rounded-md text-xs font-medium transition ${
                  refreshing
                    ? "bg-slate-100 text-slate-400 border-slate-200 cursor-wait"
                    : "bg-white text-slate-700 border-slate-300 hover:bg-slate-50"
                }`}
              >
                {refreshing ? "Refreshing…" : "↻ Refresh"}
              </button>
            </div>
          )}
          {active.length > 0 && (
            <>
              <div className="text-[11px] uppercase tracking-wide text-slate-500 mb-1.5">
                Live ({active.length})
              </div>
              <CardList
                rows={active}
                now={now}
                endedListingIds={endedListingIds}
                watchlist={watchlist}
                toggleWatch={toggleWatch}
                onClick={onClick}
                tab="watchlist"
                entryDetails={entryDetails}
                editMaxBid={editMaxBid}
                toggleNotify={toggleNotify}
                buyNow={buyNow}
                buyingIds={buyingIds}
                ebValues={ebValues}
                liveValues={liveValues}
              />
            </>
          )}
          {armedWatches.length > 0 && (
            <>
              <div className="text-[11px] uppercase tracking-wide text-amber-600 mt-6 mb-1.5">
                Auto-buy watches — waiting for a price drop ({armedWatches.length})
              </div>
              <CardList
                rows={armedWatches}
                now={now}
                endedListingIds={endedListingIds}
                watchlist={watchlist}
                toggleWatch={toggleWatch}
                onClick={onClick}
                tab="watchlist"
                entryDetails={entryDetails}
                editMaxBid={editMaxBid}
                toggleNotify={toggleNotify}
                buyNow={buyNow}
                buyingIds={buyingIds}
                ebValues={ebValues}
                liveValues={liveValues}
              />
            </>
          )}
          {expired.length > 0 && !showOld && (
            <div className="text-center mt-6">
              <button
                onClick={() => setShowOld(true)}
                className="text-[11px] uppercase tracking-wide text-slate-400 hover:text-slate-600 underline"
              >
                Show old — ended or relisted ({expired.length})
              </button>
            </div>
          )}
          {expired.length > 0 && showOld && (
            <>
              <div className="text-[11px] uppercase tracking-wide text-slate-400 mt-6 mb-1.5">
                Old — ended or relisted ({expired.length}) ·{" "}
                <button onClick={() => setShowOld(false)} className="underline hover:text-slate-600">hide</button>
              </div>
              <div className="opacity-60">
                <CardList
                  rows={expired}
                  now={now}
                  endedListingIds={endedListingIds}
                  watchlist={watchlist}
                  toggleWatch={toggleWatch}
                  onClick={onClick}
                  tab="watchlist"
                  entryDetails={entryDetails}
                  editMaxBid={editMaxBid}
                  toggleNotify={toggleNotify}
                  buyNow={buyNow}
                  buyingIds={buyingIds}
                  ebValues={ebValues}
                  liveValues={liveValues}
                />
              </div>
            </>
          )}
          {active.length === 0 && armedWatches.length === 0 && expired.length === 0 && (
            <div className="text-center py-16 text-slate-400 text-sm">
              Your watchlist is empty. Click ☆ on any listing to add it.
            </div>
          )}
        </>
      );
    }

    function CardList({ rows, now, endedListingIds, watchlist, toggleWatch, onClick, tab, entryDetails, editMaxBid, toggleNotify, buyNow, buyingIds, ebValues, liveValues }) {
      return (
        <div className="bg-white rounded-lg border border-slate-200 overflow-hidden">
          {rows.map((L, i) => (
            <Card
              key={L.listing_id}
              listing={L}
              now={now}
              isEndingFade={endedListingIds.has(L.listing_id)}
              isWatched={watchlist.has(L.listing_id)}
              toggleWatch={(e) => { e.stopPropagation(); toggleWatch(L); }}
              onClick={() => onClick(L)}
              isLast={i === rows.length - 1}
              tab={tab}
              entryDetail={entryDetails?.get(L.listing_id)}
              onEditMaxBid={editMaxBid ? (e) => { e.stopPropagation(); editMaxBid(L.listing_id, L.auction_type); } : null}
              onToggleNotify={toggleNotify ? (e) => { e.stopPropagation(); toggleNotify(L.listing_id); } : null}
              onBuyNow={buyNow ? (e) => { e.stopPropagation(); buyNow(L); } : null}
              isBuying={buyingIds ? buyingIds.has(L.listing_id) : false}
              ebValue={ebValues ? ebValues.get(L.domain) : null}
              live={liveValues ? liveValues.get(L.domain) : null}
            />
          ))}
        </div>
      );
    }

    function BidTypeBadge({ auctionType }) {
      // Per the client 5/28: visually differentiate Buy Now (closeout, instant
      // action) from Current Bid (live auction). Green = closeout (act now);
      // blue = expiring auction (bid escalation in progress).
      if (auctionType === "CLOSEOUT") {
        return (
          <span className="inline-block text-[9px] font-semibold uppercase tracking-wider px-1.5 py-0.5 rounded bg-emerald-50 text-emerald-700 border border-emerald-200 flex-shrink-0">
            Buy Now
          </span>
        );
      }
      return (
        <span className="inline-block text-[9px] font-semibold uppercase tracking-wider px-1.5 py-0.5 rounded bg-sky-50 text-sky-700 border border-sky-200 flex-shrink-0">
          Bid
        </span>
      );
    }

    function Card({ listing: rawListing, now, isEndingFade, isWatched, toggleWatch, onClick, isLast, tab, entryDetail, onEditMaxBid, onToggleNotify, onBuyNow, isBuying, ebValue, live }) {
      // Live overlay (2026-08-25): the availability API is truth; the feed
      // is yesterday. Replace price/end-time when live data exists, and
      // tag sold/ended listings GONE.
      const isGone = live && live.status === "UNAVAILABLE";
      const listing = live && !isGone ? {
        ...rawListing,
        auction_type: liveEffectiveType(live) || rawListing.auction_type,
        current_price: live.price != null ? live.price : rawListing.current_price,
        end_time_utc: live.end_time_utc || rawListing.end_time_utc,
        bid_count: live.bid_count != null ? live.bid_count : rawListing.bid_count,
        has_bids: live.bid_count != null ? live.bid_count > 0 : rawListing.has_bids,
      } : rawListing;
      const endMs = listing.end_time_utc ? new Date(listing.end_time_utc).getTime() : null;
      const remaining = endMs != null ? endMs - now : null;
      const isClose = listing.auction_type === "CLOSEOUT";
      const priceLabel = isClose ? "Buy Now" : "Current Bid";
      // 2026-07-15 (The client demo): star-then-bid works from ANY tab now —
      // the max-bid button appears on a card as soon as it's starred (the
      // backend entry exists), no scroll back to Watchlist. Two-step
      // safety preserved: no star, no bid button.
      const showMaxBid = onEditMaxBid && (tab === "watchlist" || (isWatched && entryDetail));
      const maxBidValue = entryDetail?.max_bid_dollars;
      const isArmed = entryDetail?.is_armed;
      const status = entryDetail?.status;
      // Reminder bell. Same gate as the max-bid button: it needs a backend
      // watchlist entry to hang the prefs off, which is exactly what
      // `entryDetail` proves exists.
      const showNotify = onToggleNotify && isWatched && entryDetail;
      const notifyOn = !!entryDetail?.notify_enabled;
      return (
        <div
          onClick={onClick}
          className={`flex items-center gap-3 px-4 py-3 ${isLast ? "" : "border-b border-slate-100"} hover:bg-slate-50 cursor-pointer transition ${isEndingFade ? "ending-fade" : ""}`}
        >
          {/* Star + Buy Now (closeouts only) */}
          <button
            onClick={toggleWatch}
            aria-label={isWatched ? "Remove from watchlist" : "Add to watchlist"}
            className={`text-lg flex-shrink-0 ${isWatched ? "text-amber-500" : "text-slate-300 hover:text-amber-400"}`}
          >
            {isWatched ? "★" : "☆"}
          </button>
          {showNotify && (
            <button
              onClick={onToggleNotify}
              aria-label={notifyOn ? "Turn off email reminders" : "Email me before this ends"}
              aria-pressed={notifyOn}
              title={notifyOn
                ? "Email reminders ON — 24h, 12h, 3h and 30m before this ends"
                : "Email me 24h, 12h, 3h and 30m before this ends"}
              className={`flex-shrink-0 transition ${
                notifyOn ? "text-indigo-600" : "text-slate-300 hover:text-indigo-400"
              }`}
            >
              {/* Inline SVG rather than 🔔/🔕: emoji render in their own
                  colors, so they can't show on/off state the way the
                  star's ★/☆ does. currentColor picks up the classes above. */}
              <svg width="16" height="16" viewBox="0 0 20 20" aria-hidden="true"
                   fill={notifyOn ? "currentColor" : "none"}
                   stroke="currentColor" strokeWidth="1.6"
                   strokeLinecap="round" strokeLinejoin="round">
                <path d="M10 2.5a4.5 4.5 0 0 0-4.5 4.5c0 3.2-.9 4.7-1.6 5.5-.3.3-.1.9.4.9h11.4c.5 0 .7-.6.4-.9-.7-.8-1.6-2.3-1.6-5.5A4.5 4.5 0 0 0 10 2.5Z" />
                <path d="M8.2 16.2a2 2 0 0 0 3.6 0" fill="none" />
              </svg>
            </button>
          )}
          {isClose && onBuyNow && (
            <button
              onClick={isBuying ? undefined : onBuyNow}
              disabled={isBuying}
              aria-label="Buy Now"
              title={isBuying ? "Purchase in progress…" : `Buy ${listing.domain} now at ${formatPrice(listing.current_price)}`}
              className={`text-[10px] font-semibold uppercase tracking-wider px-2 py-1 rounded transition flex-shrink-0 ${
                isBuying
                  ? "bg-slate-300 text-slate-500 cursor-wait"
                  : "bg-emerald-600 text-white hover:bg-emerald-700"
              }`}
            >
              {isBuying ? "…" : "Buy"}
            </button>
          )}

          {/* Main content -- two lines */}
          <div className="flex-1 min-w-0">
            <div className="flex items-center gap-2 mb-0.5">
              <BidTypeBadge auctionType={listing.auction_type} />
              <div className="font-semibold truncate" data-monospace>{listing.domain}</div>
              {listing.score != null && (
                <span className={`inline-block text-[10px] px-1.5 py-0.5 rounded border flex-shrink-0 ${scoreColor(listing.score)}`}>
                  {listing.score}
                </span>
              )}
              {listing._verifying && (
                <span className="inline-block text-[10px] px-1.5 py-0.5 rounded border flex-shrink-0 bg-sky-50 text-sky-600 border-sky-200">
                  checking live status…
                </span>
              )}
              {isGone && !listing._armed_watch && (
                <span className="inline-block text-[10px] px-1.5 py-0.5 rounded border flex-shrink-0 bg-rose-50 text-rose-600 border-rose-200 font-semibold">
                  GONE — sold or ended
                </span>
              )}
              {live && live.watching && !isGone && (
                <span title="On the GoDaddy-app watchlist" className="text-indigo-400 text-xs flex-shrink-0">🔔</span>
              )}
              {live && live.already_bidding && !isGone && (
                // Self-bidding collision guard (2026-09-24, the client's #1 fear):
                // GoDaddy says he already has a bid on this. The sniper will
                // stand down rather than bid against himself — this flag makes
                // that visible so nothing happens behind his back.
                <span
                  title={`You already have a bid on GoDaddy (${live.member_bidding_status || "bidding"}). The sniper will NOT fire on this to avoid raising your own price.`}
                  className="inline-block text-[10px] px-1.5 py-0.5 rounded border flex-shrink-0 bg-rose-100 text-rose-700 border-rose-400 font-bold"
                >
                  ⚠ YOU ALREADY HAVE A BID
                </span>
              )}
              {ebValue != null && ebValue.sp != null && (
                // The client's SP flag (2026-08-28, the $60 misspelled-domain
                // lesson): this name is one typo away from a real word.
                // Hover shows what it's probably supposed to be.
                <span
                  title={`Possible misspelling: ${ebValue.sp}`}
                  className="inline-block text-[10px] px-1.5 py-0.5 rounded border flex-shrink-0 bg-orange-50 text-orange-700 border-orange-300 font-bold"
                >
                  SP?
                </span>
              )}
              {listing._armed_watch && (
                <span className="inline-block text-[10px] px-1.5 py-0.5 rounded border flex-shrink-0 bg-amber-50 text-amber-700 border-amber-200 font-semibold">
                  auto-buy armed — watching for comeback
                </span>
              )}
              {listing._old_reason && (
                <span className="inline-block text-[10px] px-1.5 py-0.5 rounded border flex-shrink-0 bg-slate-50 text-slate-500 border-slate-200">
                  {listing._old_reason}
                </span>
              )}
            </div>
            <div className="text-xs text-slate-500 flex flex-wrap items-center gap-x-2 gap-y-0.5">
              <span><span className="text-slate-400">{priceLabel}:</span> <span className="font-medium text-slate-700" data-monospace>{formatPrice(listing.current_price)}</span></span>
              {(listing.estimated_value || (ebValue && ebValue.gd_est)) && (
                // Valuation colors (The client-readable at a glance):
                // GD = light green, Estibot = indigo (amber when $1k+).
                // Falls back to the full-index valuation when the feed row
                // has none (2026-09-07 vlr.co: starred from search/Top
                // Value, no feed data, GD est showed blank).
                <span className="text-emerald-500" data-monospace>
                  · GD est <span className="font-medium text-emerald-600">{formatPrice(listing.estimated_value || ebValue.gd_est)}</span>
                </span>
              )}
              {ebValue != null && ebValue.estibot != null && (
                // Estibot appraisal — deliberately a different color from
                // the GD number so the client reads the two models at a glance:
                // GD = green, Estibot = indigo, amber when $1k+ (his flag).
                <span className={Number(ebValue.estibot) >= 1000
                  ? "text-amber-700 font-semibold"
                  : "text-indigo-600"} data-monospace>
                  · EB <span className="font-semibold">{formatPrice(ebValue.estibot)}</span>
                </span>
              )}
              {/* Renewal removed from the main line (2026-09-24 the client call:
                  "extra junk" — his bulk rate is ~$10.47 regardless). It
                  still shows in the detail drawer's Renewal (est.) row. */}
              {(listing.bid_count || 0) > 0 ? (
                <span className="text-slate-500">· {listing.bid_count} bids</span>
              ) : listing.has_bids ? (
                <span className="text-slate-500">· has bids</span>
              ) : null}
              {listing.tld_spread_checked && (
                <span className="text-slate-500" data-monospace>
                  · TLDs {listing.tld_spread_taken}/{listing.tld_spread_checked}
                </span>
              )}
              {remaining != null && (
                <span className={`font-medium ${urgencyClass(remaining)}`}>
                  · {formatRemaining(remaining)}
                </span>
              )}
            </div>
            {/* Watchlist-only second row: max-bid display + edit.
                2026-09-07: while entry details are still LOADING,
                entryDetail is undefined — showing "+ Set max bid" there
                told Adam five saved bids had vanished. Unknown != absent:
                loading gets a quiet placeholder; the set-bid button only
                renders once the backend has confirmed the real state. */}
            {showMaxBid && !entryDetail && (
              <div className="text-xs flex items-center gap-2 mt-1">
                <span className="inline-flex items-center px-2 py-0.5 rounded border text-[11px] bg-slate-50 text-slate-400 border-slate-200">
                  loading bid…
                </span>
              </div>
            )}
            {showMaxBid && entryDetail && (
              <div className="text-xs flex items-center gap-2 mt-1">
                <button
                  onClick={onEditMaxBid}
                  className={`inline-flex items-center gap-1 px-2 py-0.5 rounded border text-[11px] font-medium transition ${
                    maxBidValue != null
                      ? "bg-indigo-50 text-indigo-900 border-indigo-200 hover:bg-indigo-100"
                      : "bg-slate-50 text-slate-600 border-slate-200 hover:bg-slate-100"
                  }`}
                  aria-label="Set max bid"
                >
                  {isClose
                    ? (maxBidValue != null
                        ? <>Auto-buy at ≤ <span data-monospace>{formatPrice(maxBidValue)}</span></>
                        : <>+ Set auto-buy price</>)
                    : (maxBidValue != null
                        ? <>Max bid: <span data-monospace>{formatPrice(maxBidValue)}</span></>
                        : <>+ Set max bid</>)
                  }
                </button>
                {status && status !== "pending" && (
                  <span className="text-[10px] uppercase tracking-wide text-slate-500">
                    {status}
                  </span>
                )}
                {isArmed === false && (
                  <span className="text-[10px] uppercase tracking-wide text-rose-600">
                    disarmed
                  </span>
                )}
              </div>
            )}
          </div>
        </div>
      );
    }

    // -----------------------------------------------------------------------
    // Empty-tab message
    // -----------------------------------------------------------------------

    function EmptyTab({ tab, hasFilters }) {
      const messages = {
        closing_soon: hasFilters
          ? "No closing-soon items match your filters. Try widening the time window or clearing the search."
          : "Nothing closing in this window yet. Try a wider time window above.",
        top_rated:    hasFilters
          ? "No high-scored items match your filters. Try widening the time window or clearing the search."
          : "No scored listings in this time window. Try a wider window above.",
        watchlist:    "Your watchlist is empty. Click ☆ on any listing to add it.",
      };
      return (
        <div className="text-center py-16 text-slate-400 text-sm">
          {messages[tab] || "Nothing to show."}
        </div>
      );
    }

    // -----------------------------------------------------------------------
    // Detail drawer (slides in from the right on click)
    // -----------------------------------------------------------------------

    function DetailDrawer({ listing, onClose, isWatched, toggleWatch, now, sig }) {
      useEffect(() => {
        const handler = (e) => { if (e.key === "Escape") onClose(); };
        window.addEventListener("keydown", handler);
        return () => window.removeEventListener("keydown", handler);
      }, [onClose]);

      const bd = listing.score_breakdown || {};
      const components = [
        ["TLD", bd.tld],
        ["Length", bd.length],
        ["Composition", bd.composition],
        ["Word content", bd.word_content],
        ["Themes", bd.themes],
        ["the client signals", bd.preference_signals],
        ["Demand", bd.demand],
      ];
      const endMs = listing.end_time_utc ? new Date(listing.end_time_utc).getTime() : null;
      const remaining = endMs != null ? endMs - now : null;

      return (
        <div className="fixed inset-0 z-50 flex justify-end" onClick={onClose}>
          <div className="absolute inset-0 bg-slate-900/30" />
          <aside
            onClick={(e) => e.stopPropagation()}
            className="relative w-full max-w-md bg-white shadow-2xl overflow-y-auto h-full"
          >
            {sig != null && sig.sp != null && (
              // SP flag, loud version (2026-08-28): the $60 misspelled
              // domain would have been caught right here.
              <div className="bg-orange-50 border-b border-orange-200 px-4 py-2.5 text-sm text-orange-800">
                <span className="font-bold">SP — possible misspelling:</span>{" "}
                <span data-monospace>{sig.sp}</span>. Double-check this is the
                name you actually want before bidding.
              </div>
            )}
            <div className="p-4 border-b sticky top-0 bg-white flex items-start justify-between gap-3">
              <div>
                <div className="text-lg font-semibold" data-monospace>{listing.domain}</div>
                <div className="text-xs text-slate-500 mt-0.5">
                  {listing.auction_type === "CLOSEOUT" ? "Closeout" : "Expiring auction"}
                  {" · "}
                  {formatPrice(listing.current_price)}
                  {listing.has_bids && " · has bids"}
                </div>
                {remaining != null && (
                  <div className={`text-sm font-medium mt-1 ${urgencyClass(remaining)}`}>
                    {formatRemaining(remaining)}
                    {endMs != null && (
                      <span className="text-slate-400 font-normal text-xs ml-2">
                        ({formatEndAbsolute(listing.end_time_utc)})
                      </span>
                    )}
                  </div>
                )}
              </div>
              <div className="flex items-center gap-2">
                <button
                  onClick={toggleWatch}
                  className={`text-xs px-2 py-1 rounded border ${
                    isWatched
                      ? "bg-amber-50 text-amber-800 border-amber-300"
                      : "bg-white text-slate-700 hover:bg-slate-50"
                  }`}
                >
                  {isWatched ? "★ Watched" : "☆ Watch"}
                </button>
                <button onClick={onClose} className="text-slate-400 hover:text-slate-900 text-xl leading-none">×</button>
              </div>
            </div>

            <div className="p-4 space-y-5">
              <Section title="Domain signals">
                <table className="w-full text-sm">
                  <tbody>
                    <tr className="border-b">
                      <td className="py-1.5 text-slate-600">GoDaddy est.</td>
                      <td className="py-1.5 text-right font-medium text-emerald-600" data-monospace>
                        {listing.estimated_value ? formatPrice(listing.estimated_value) : "—"}
                      </td>
                    </tr>
                    <tr className="border-b">
                      <td className="py-1.5 text-slate-600">Estibot est.</td>
                      <td className={`py-1.5 text-right font-medium ${sig?.estibot != null && Number(sig.estibot) >= 1000 ? "text-amber-700" : "text-indigo-600"}`} data-monospace>
                        {sig?.estibot != null ? formatPrice(sig.estibot) : "—"}
                      </td>
                    </tr>
                    <tr className="border-b">
                      <td className="py-1.5 text-slate-600">Pages indexed on the web</td>
                      <td className="py-1.5 text-right" data-monospace>
                        {sig?.indexed_pages != null ? sig.indexed_pages.toLocaleString() : "—"}
                      </td>
                    </tr>
                    <tr className="border-b">
                      <td className="py-1.5 text-slate-600">Extensions taken</td>
                      <td className="py-1.5 text-right" data-monospace>
                        {sig?.exact_match_tlds != null
                          ? `${sig.exact_match_tlds} TLDs${sig?.developed_tlds != null ? ` · ${sig.developed_tlds} developed` : ""}`
                          : "—"}
                      </td>
                    </tr>
                    <tr className="border-b">
                      <td className="py-1.5 text-slate-600">Google searches / mo</td>
                      <td className={`py-1.5 text-right font-medium ${sig?.search_volume >= 160000 ? "text-amber-700 font-semibold" : ""}`} data-monospace>
                        {sig?.search_volume != null ? sig.search_volume.toLocaleString() : "—"}
                        {sig?.search_volume >= 160000 ? " ★" : ""}
                      </td>
                    </tr>
                    <tr className="border-b">
                      <td className="py-1.5 text-slate-600">Cost per click</td>
                      <td className="py-1.5 text-right" data-monospace>
                        {sig?.cpc != null ? `$${Number(sig.cpc).toFixed(2)}` : "—"}
                      </td>
                    </tr>
                    <tr>
                      <td className="py-1.5 text-slate-600">Renewal (est.)</td>
                      <td className="py-1.5 text-right" data-monospace>
                        {sig?.renewal_est != null ? `${formatPrice(sig.renewal_est)}/yr` : "—"}
                      </td>
                    </tr>
                  </tbody>
                </table>
              </Section>

              <Section title="Score">
                <div className="flex items-center gap-3">
                  <div className={`text-2xl font-semibold px-3 py-1.5 rounded border ${scoreColor(listing.score)}`}>
                    {listing.score}
                  </div>
                  <div className="text-xs text-slate-500">
                    {listing.score >= 110 ? "Strong buy signal" :
                     listing.score >= 90  ? "Worth considering" :
                     listing.score >= 60  ? "Marginal" : "Low priority"}
                  </div>
                </div>
              </Section>

              {components.some(([_, v]) => v != null) && (
                <Section title="Score breakdown">
                  <table className="w-full text-sm">
                    <tbody>
                      {components.filter(([_, v]) => v != null).map(([k, v]) => (
                        <tr key={k} className="border-b last:border-b-0">
                          <td className="py-1.5 text-slate-600">{k}</td>
                          <td className={`py-1.5 text-right ${v < 0 ? "text-rose-700" : v > 0 ? "text-emerald-700" : "text-slate-500"}`} data-monospace>
                            {v > 0 ? `+${v}` : v}
                          </td>
                        </tr>
                      ))}
                    </tbody>
                  </table>
                </Section>
              )}

              {(listing.themes || []).length > 0 && (
                <Section title="Themes">
                  <div className="flex flex-wrap gap-1.5">
                    {listing.themes.map(t => (
                      <span key={t} className="text-xs px-2 py-1 bg-slate-100 text-slate-700 rounded">{t}</span>
                    ))}
                  </div>
                </Section>
              )}

              {bd.notes && bd.notes.length > 0 && (
                <Section title="Why this score?">
                  <ul className="text-xs text-slate-700 space-y-1 list-disc list-inside">
                    {bd.notes.map((n, i) => <li key={i}>{n}</li>)}
                  </ul>
                </Section>
              )}

              {(bd.valuation && Object.values(bd.valuation).some(v => v != null)) ? (
                <Section title="Valuation (Estibot)">
                  <table className="w-full text-sm">
                    <tbody>
                      {Object.entries(bd.valuation).map(([k, v]) => (
                        <tr key={k} className="border-b last:border-b-0">
                          <td className="py-1.5 text-slate-600">{k.replace(/_/g, " ")}</td>
                          <td className="py-1.5 text-right" data-monospace>{v ?? "—"}</td>
                        </tr>
                      ))}
                    </tbody>
                  </table>
                </Section>
              ) : (
                <Section title="Valuation (Estibot)">
                  <div className="text-xs text-slate-400 italic">N/A — Estibot not connected.</div>
                </Section>
              )}

              {listing.tld_spread_checked && (
                <Section title="TLD spread">
                  <div className="text-sm">
                    <strong>{listing.tld_spread_taken}</strong> of <strong>{listing.tld_spread_checked}</strong> common TLDs already registered
                    <span className="text-slate-500"> ({Math.round(listing.tld_spread_ratio * 100)}%)</span>
                  </div>
                </Section>
              )}

              <Section title="Identifiers">
                <div className="text-xs text-slate-500 space-y-0.5" data-monospace>
                  <div>listing_id: {listing.listing_id}</div>
                  <div>tld: .{listing.tld}</div>
                  {listing.estimated_value && <div>estimated_value: ${listing.estimated_value}</div>}
                  {listing.end_time_utc && <div>ends: {new Date(listing.end_time_utc).toISOString()}</div>}
                </div>
              </Section>

              <div className="pt-2 border-t">
                <a
                  href={`https://www.godaddy.com/domainsearch/find?domainToCheck=${encodeURIComponent(listing.domain)}`}
                  target="_blank"
                  rel="noopener noreferrer"
                  className="text-xs text-slate-700 hover:text-slate-900 underline"
                >
                  Look up on GoDaddy →
                </a>
              </div>
            </div>
          </aside>
        </div>
      );
    }

    function Section({ title, children }) {
      return (
        <section>
          <div className="text-[11px] uppercase tracking-wide text-slate-500 mb-1.5">{title}</div>
          {children}
        </section>
      );
    }

    // -----------------------------------------------------------------------
    // Mount
    // -----------------------------------------------------------------------

    ReactDOM.createRoot(document.getElementById("root")).render(<App />);
  </script>
</body>
</html>
