[project]
name = "domain-auction-sniper"
version = "0.1.0"
description = "Domain auction monitor: scores GoDaddy auction inventory, tracks a watchlist, and places capped bids at the right moment."
requires-python = ">=3.11"
authors = [{ name = "Adam Flores", email = "adam@deepsteppe.com" }]

dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.29",
    "psycopg2-binary>=2.9",  # used by alembic; runtime app uses asyncpg
    "alembic>=1.13",
    "httpx>=0.27",
    "redis>=5.0",
    "apscheduler>=3.10",
    "lxml>=5.1",
    # Double Metaphone for the phonetic fallback in the scoring engine.
    "metaphone>=0.6",
    # Streaming JSON parser — builds the full-inventory index (935k rows)
    # on the 256MB Fly machine without loading the decompressed feed
    # (~400MB) into memory.
    "ijson>=3.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=4.1",
    "aiosqlite>=0.20",  # in-memory async DB for governor/persistence tests
    "ruff>=0.3",
    "mypy>=1.8",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
python_files = "test_*.py"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "RUF"]
ignore = ["E501"]  # line length covered by formatter

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*", "worker*"]
